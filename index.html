<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Sistema Personal</title>
  <meta name="description" content="Entrenamiento, suelo pélvico, movilidad y progreso. Uso personal y privado.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
/* Estilos de Mi Sistema Personal.
   Diseño: una sola columna pensada para el teléfono, tarjetas solo donde separan bloques,
   barra de pestañas fija abajo. Paleta negro y amarillo (un solo tema oscuro, elegido a propósito).
   Para cambiar colores, edita solo los "tokens" de :root. */

:root {
  --bg: #0A0A0A;          /* fondo: negro */
  --surface: #151515;     /* tarjetas */
  --surface-2: #222222;   /* fondos secundarios */
  --ink: #F4F3EE;         /* texto principal */
  --muted: #A6A49C;       /* texto secundario */
  --line: #2E2E2C;        /* bordes */
  --accent: #FFD000;      /* amarillo principal */
  --accent-ink: #0A0A0A;  /* texto sobre amarillo */
  --accent-soft: #332A05; /* amarillo apagado para fondos */
  --signal: #FF9A3C;
  --signal-soft: #3A230C;
  --ok: #5ED38E;
  --ok-soft: #12301F;
  --warn: #FFB547;
  --warn-soft: #3A2A0D;
  --bad: #FF6B5E;
  --bad-soft: #3A1614;

  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Avenir Next", "Segoe UI Variable Display", system-ui, -apple-system, Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radio: 14px;
  --radio-sm: 9px;
  --alto-pestanas: 64px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

[hidden] { display: none !important; }

a { color: var(--accent); }
img, video { max-width: 100%; display: block; }

h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 650; }
.h3 { font-size: 1.05rem; font-weight: 650; }
.h4 { font-size: 0.95rem; font-weight: 650; margin-top: 8px; }
p { margin: 0; }

.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.8rem; }
.apagado { color: var(--muted); }
.pie { color: var(--muted); font-size: 0.85rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.saltar { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.saltar:focus { left: 12px; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Estructura ---------- */

.barra-superior {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.marca { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; }
.marca svg { width: 22px; height: 22px; color: var(--accent); }
.estado-guardado { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.estado-guardado.sin-guardado { color: var(--bad); font-weight: 600; }

.contenido {
  max-width: 640px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px calc(var(--alto-pestanas) + 32px + env(safe-area-inset-bottom, 0px));
  outline: none;
}

.pestanas {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.pestanas a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--alto-pestanas);
  color: var(--muted);
  text-decoration: none;
  font-size: 0.72rem;
  font-weight: 600;
}
.pestanas svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pestanas a.activa { color: var(--accent); }
.pestanas a.activa svg { stroke-width: 2.2; }

.pila { display: flex; flex-direction: column; gap: 16px; }
.pila-corta { display: flex; flex-direction: column; gap: 10px; }
.fila-entre { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.fila-etiquetas { display: flex; gap: 8px; flex-wrap: wrap; }

.encabezado { display: flex; flex-direction: column; gap: 6px; }
.sobretitulo { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.volver { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; min-height: 32px; }

/* ---------- Iconos ---------- */

.icono { display: inline-flex; width: 1.15em; height: 1.15em; flex: none; }
.icono svg { width: 100%; height: 100%; }
.con-icono { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- Tarjetas y bloques ---------- */

.tarjeta {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radio);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  min-width: 0;
}
.tarjeta-hoy { border-width: 1px; border-top: 4px solid var(--accent); gap: 12px; }
.tarjeta-hoy.tipo-recuperacion { border-top-color: var(--signal); }
.tarjeta-hoy.tipo-descanso { border-top-color: var(--muted); }
.tarjeta-hoy h2 { font-size: 1.45rem; }
.tarjeta-peligro { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.vacio { align-items: flex-start; }

.minutos { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }

.lista-secciones { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lista-secciones li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }

.progreso { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.barra { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }

/* ---------- Etiquetas ---------- */

.etiqueta {
  display: inline-flex; align-items: center;
  padding: 2px 9px;
  border-radius: 99px;
  font-size: 0.75rem; font-weight: 650;
  white-space: nowrap;
  background: var(--surface-2); color: var(--ink);
}
.etiqueta-entreno, .etiqueta-acento { background: var(--accent-soft); color: var(--accent); }
.etiqueta-recuperacion { background: var(--signal-soft); color: var(--signal); }
.etiqueta-descanso { background: var(--surface-2); color: var(--muted); }
.etiqueta-ok { background: var(--ok-soft); color: var(--ok); }
.etiqueta-aviso { background: var(--warn-soft); color: var(--warn); }
.etiqueta-alerta { background: var(--bad-soft); color: var(--bad); }
.etiqueta-apagado { background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* ---------- Botones ---------- */

.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid transparent;
  font: inherit; font-weight: 650; font-size: 0.98rem;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.boton-principal { background: var(--accent); color: var(--accent-ink); }
.boton-principal:active { filter: brightness(0.92); }
.boton-secundario { background: var(--surface); color: var(--ink); border-color: var(--line); }
.boton-secundario:active { background: var(--surface-2); }
.boton-texto { background: transparent; color: var(--accent); padding-inline: 8px; }
.boton-peligro { background: var(--bad); color: var(--bg); }
.boton-peligro-texto { color: var(--bad); }
.boton-ancho { width: 100%; }

.enlace { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.92rem; min-height: 32px; }

.acciones { display: flex; flex-wrap: wrap; gap: 10px; }
.acciones .boton { flex: 1 1 140px; }

/* ---------- Avisos ---------- */

.avisos { display: flex; flex-direction: column; gap: 8px; }
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radio-sm); font-size: 0.92rem; line-height: 1.45; }
.aviso .icono { margin-top: 2px; }
.aviso-info { background: var(--accent-soft); color: var(--ink); }
.aviso-info .icono { color: var(--accent); }
.aviso-alerta { background: var(--bad-soft); color: var(--ink); }
.aviso-alerta .icono { color: var(--bad); }
.aviso .vinetas { margin-top: 4px; }

/* ---------- Semana ---------- */

.tira-semana { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.punto-dia {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 0;
  border-radius: 10px;
  text-decoration: none; color: var(--ink);
  background: var(--surface-2);
}
.punto-dia .letra { font-weight: 700; font-size: 0.85rem; }
.punto-dia .marca { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }
.punto-dia.estado-completo { background: var(--ok-soft); color: var(--ok); }
.punto-dia.estado-parcial { background: var(--warn-soft); color: var(--warn); }
.punto-dia.estado-antes { opacity: 0.45; }
.punto-dia.es-hoy { outline: 2px solid var(--accent); outline-offset: 1px; }

.nav-semana { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav-semana .boton { min-height: 44px; padding-inline: 12px; font-size: 0.9rem; }

.lista-dias, .lista-fichas, .lista-actividades { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.fila-dia, .fila-ficha {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radio-sm);
  color: var(--ink); text-decoration: none;
  min-height: 60px;
}
.fila-dia.es-hoy { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.fecha-dia { display: flex; flex-direction: column; align-items: center; width: 40px; flex: none; }
.dia-nombre { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.dia-num { font-size: 1.25rem; font-weight: 700; font-family: var(--font-display); }
.info-dia { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.info-dia .apagado { font-size: 0.85rem; }
.estado-dia { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chevron { color: var(--muted); }

.resumen-sesion { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--ink); text-decoration: none; }
.resumen-sesion .apagado { font-size: 0.88rem; }

/* ---------- Día ---------- */

.seccion { display: flex; flex-direction: column; gap: 10px; }
.titulo-seccion {
  font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); font-family: var(--font-body);
  padding-top: 8px;
}
.nota-seccion { font-size: 0.85rem; color: var(--muted); }

.actividad { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio-sm); overflow: hidden; }
.actividad.est-hecho { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.actividad.est-omitido { opacity: 0.8; }
.actividad-cabecera {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 12px 14px;
  min-height: 64px;
  background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.estado-icono {
  width: 28px; height: 28px; flex: none;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--surface);
}
.est-hecho .estado-icono { background: var(--ok); border-color: var(--ok); }
.est-omitido .estado-icono { background: var(--muted); border-color: var(--muted); }
.actividad-texto { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.actividad-nombre { font-weight: 650; }
.est-omitido .actividad-nombre { text-decoration: line-through; text-decoration-color: var(--muted); }
.actividad-detalle { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.actividad-lado { display: flex; align-items: center; gap: 6px; flex: none; }
.actividad .chevron { transition: transform .2s ease; }
.actividad.abierta .chevron { transform: rotate(90deg); }
.actividad-cuerpo { padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.clave { font-weight: 600; padding-left: 12px; border-left: 3px solid var(--accent); }

.resumen-entrada { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 0.92rem; }
.resumen-entrada dt { color: var(--muted); }
.resumen-entrada dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Formularios ---------- */

.formulario { display: flex; flex-direction: column; gap: 14px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend, .campo label { font-weight: 600; font-size: 0.92rem; margin-bottom: 6px; padding: 0; }
.campo { display: flex; flex-direction: column; }
.ayuda { font-size: 0.84rem; color: var(--muted); margin-bottom: 8px; }

input[type="number"], input[type="date"], textarea {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 48px;
  width: 100%;
}
textarea { min-height: 72px; resize: vertical; }
input:focus-visible, textarea:focus-visible { border-color: var(--accent); }

.series-fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.campo-serie label { font-size: 0.8rem; color: var(--muted); }
.campo-serie input { text-align: center; font-size: 1.15rem; font-weight: 650; font-variant-numeric: tabular-nums; }

.opciones-fila { display: flex; flex-wrap: wrap; gap: 6px; }
.opcion { position: relative; }
.opcion input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opcion label {
  display: inline-flex; align-items: center;
  min-height: 42px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 99px;
  background: var(--bg);
  font-size: 0.9rem; font-weight: 600; margin: 0;
  cursor: pointer;
}
.opcion input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opcion input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

.error { color: var(--bad); font-weight: 600; font-size: 0.9rem; }

/* ---------- Ficha de ejercicio ---------- */

.ficha { gap: 22px; }
.bloque-ficha { display: flex; flex-direction: column; gap: 8px; }
.bloque-ficha h2 { display: flex; align-items: baseline; gap: 10px; font-size: 1.1rem; }
.num-bloque { font-size: 0.78rem; color: var(--accent); font-weight: 700; font-family: var(--font-mono); }
.pasos, .vinetas { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
.pasos li::marker { color: var(--accent); font-weight: 700; }
.vinetas li::marker { color: var(--muted); }

.medio { margin: 0; border-radius: var(--radio); overflow: hidden; background: var(--surface-2); }
.medio-pendiente { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 16px; border: 1px dashed var(--line); color: var(--muted); }
.medio-pendiente svg { width: 120px; height: 80px; }
.medio-pendiente figcaption { font-size: 0.85rem; text-align: center; max-width: 34ch; }

/* ---------- Modal y aviso flotante ---------- */

.capa-modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.modal-fondo { position: absolute; inset: 0; background: rgb(0 0 0 / 0.45); }
.modal { position: relative; width: 100%; max-width: 440px; background: var(--surface); color: var(--ink); border-radius: var(--radio); padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 40px rgb(0 0 0 / 0.25); }
.modal-acciones { display: flex; gap: 10px; flex-wrap: wrap; }
.modal-acciones .boton { flex: 1 1 120px; }

.toast {
  position: fixed; left: 16px; right: 16px;
  bottom: calc(var(--alto-pestanas) + 14px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  max-width: 480px; margin: 0 auto;
  padding: 12px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg);
  font-weight: 600; font-size: 0.92rem;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.visible { opacity: 1; transform: none; }
.toast-alerta { background: var(--bad); color: var(--bg); }
.toast-aviso { background: var(--warn); color: var(--bg); }

@media (min-width: 720px) {
  .contenido { padding-block-start: 32px; }
  h1 { font-size: 2rem; }
  .capa-modal { align-items: center; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- Acceso directo y área privada ---------- */

.acceso-directo { text-decoration: none; color: var(--ink); }
.acceso-directo:active { background: var(--surface-2); }

.casilla { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; cursor: pointer; }
.casilla input { width: 22px; height: 22px; margin-top: 1px; flex: none; accent-color: var(--accent); }

.segmentos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
.segmentos a { display: flex; align-items: center; justify-content: center; min-height: 42px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 650; font-size: 0.92rem; }
.segmentos a.activa { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

.escala { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.escala-banda { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--radio-sm); }
.escala-banda > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.escala-num { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; width: 3.2ch; flex: none; }
.escala-texto { font-size: 0.86rem; color: var(--muted); }

.tono-baja { background: var(--surface-2); }
.tono-moderada { background: var(--accent-soft); }
.tono-pausa { background: var(--warn-soft); }
.tono-alta { background: var(--signal-soft); }
.tono-limite { background: var(--bad-soft); }

.rejilla-niveles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.nivel {
  min-height: 52px; border-radius: 12px; border: 1px solid var(--line);
  font: inherit; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--ink);
  cursor: pointer; font-variant-numeric: tabular-nums;
}
.nivel.tono-pausa { border-color: var(--warn); border-width: 2px; }
.nivel:active { filter: brightness(0.92); }

.reloj { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
.panel-pausa { gap: 14px; }
.guia-respiracion { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; text-align: center; padding: 18px 8px; border-radius: var(--radio-sm); background: var(--surface); transition: transform 4s ease-in-out; }
.guia-respiracion[data-fase="entra"] { transform: scale(1.04); }
.guia-respiracion[data-fase="sale"] { transform: scale(0.97); }

.practica { gap: 6px; }

  <script type="module">
// ---- js/storage/db.js ----
// Guardado local con IndexedDB (el almacén de datos del propio navegador).
// Nada de esto sale de tu dispositivo: no hay servidor ni servicios externos.
// Si IndexedDB no está disponible (por ejemplo, en algunos modos privados),
// la app sigue funcionando en "modo temporal" y avisa de que los datos se perderán al cerrar.

const NOMBRE_DB = 'mi-sistema-personal';
const VERSION_DB = 3; // 2: área privada · 3: evaluaciones semanales
const FORMATO_COPIA = 1;
const ID_APP = 'mi-sistema-personal';

let conexion = null;
let modoTemporal = false;
const memoria = { registros: new Map(), ajustes: new Map(), privado: new Map(), evaluaciones: new Map() };

function promesa(peticion) {
  return new Promise((resolve, reject) => {
    peticion.onsuccess = () => resolve(peticion.result);
    peticion.onerror = () => reject(peticion.error);
  });
}

function abrir() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      reject(new Error('IndexedDB no disponible'));
      return;
    }
    const peticion = indexedDB.open(NOMBRE_DB, VERSION_DB);
    peticion.onupgradeneeded = () => {
      const db = peticion.result;
      if (!db.objectStoreNames.contains('registros')) db.createObjectStore('registros', { keyPath: 'fecha' });
      if (!db.objectStoreNames.contains('ajustes')) db.createObjectStore('ajustes', { keyPath: 'clave' });
      if (!db.objectStoreNames.contains('privado')) db.createObjectStore('privado', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('evaluaciones')) db.createObjectStore('evaluaciones', { keyPath: 'semana' });
    };
    peticion.onsuccess = () => resolve(peticion.result);
    peticion.onerror = () => reject(peticion.error);
    peticion.onblocked = () => reject(new Error('Base de datos bloqueada por otra pestaña'));
  });
}

async function iniciarAlmacen() {
  try {
    conexion = await abrir();
    modoTemporal = false;
    // Pide al navegador que no borre estos datos automáticamente si falta espacio.
    try {
      if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
    } catch (_) { /* opcional */ }
  } catch (error) {
    console.warn('Guardado local no disponible:', error);
    conexion = null;
    modoTemporal = true;
  }
  return { modoTemporal };
}

function esModoTemporal() {
  return modoTemporal;
}

async function operar(almacen, modo, accion) {
  if (modoTemporal || !conexion) return accion(null);
  const tx = conexion.transaction(almacen, modo);
  const resultado = await accion(tx.objectStore(almacen));
  await new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('Operación cancelada'));
  });
  return resultado;
}

function avisarGuardado(fechaHora) {
  if (typeof window !== 'undefined') {
    window.dispatchEvent(new CustomEvent('datos-guardados', { detail: { fechaHora } }));
  }
}

async function marcarGuardado() {
  const fechaHora = new Date().toISOString();
  await operar('ajustes', 'readwrite', (s) => {
    const fila = { clave: 'ultimoGuardado', valor: fechaHora };
    if (!s) { memoria.ajustes.set(fila.clave, fila); return null; }
    return promesa(s.put(fila));
  });
  avisarGuardado(fechaHora);
  return fechaHora;
}

async function leerUltimoGuardado() {
  return operar('ajustes', 'readonly', async (s) => {
    const fila = s ? await promesa(s.get('ultimoGuardado')) : memoria.ajustes.get('ultimoGuardado');
    return fila ? fila.valor : null;
  });
}

// ---------- Ajustes ----------

const AJUSTES_INICIALES = { inicio: null };

async function leerAjustes() {
  return operar('ajustes', 'readonly', async (s) => {
    const fila = s ? await promesa(s.get('principal')) : memoria.ajustes.get('principal');
    return { ...AJUSTES_INICIALES, ...(fila ? fila.valor : {}) };
  });
}

async function guardarAjustes(ajustes) {
  const fila = { clave: 'principal', valor: { ...ajustes } };
  await operar('ajustes', 'readwrite', (s) => {
    if (!s) { memoria.ajustes.set(fila.clave, fila); return null; }
    return promesa(s.put(fila));
  });
  await marcarGuardado();
  return fila.valor;
}

// ---------- Registros diarios ----------
// Un registro por día: { fecha: 'AAAA-MM-DD', actividades: { [idActividad]: entrada }, actualizado }

async function leerRegistros() {
  const lista = await operar('registros', 'readonly', (s) => (s ? promesa(s.getAll()) : [...memoria.registros.values()]));
  const mapa = {};
  for (const r of lista) mapa[r.fecha] = r;
  return mapa;
}

async function guardarRegistro(registro) {
  const fila = { ...registro, actualizado: new Date().toISOString() };
  await operar('registros', 'readwrite', (s) => {
    if (!s) { memoria.registros.set(fila.fecha, fila); return null; }
    return promesa(s.put(fila));
  });
  await marcarGuardado();
  return fila;
}

async function borrarRegistro(fecha) {
  await operar('registros', 'readwrite', (s) => {
    if (!s) { memoria.registros.delete(fecha); return null; }
    return promesa(s.delete(fecha));
  });
  await marcarGuardado();
}

// ---------- Evaluaciones semanales ----------
// Una por semana: { semana: 'AAAA-MM-DD' (lunes), respuestas, propuestas, aceptadas, guardado }

async function leerEvaluaciones() {
  const lista = await operar('evaluaciones', 'readonly', (s) => (s ? promesa(s.getAll()) : [...memoria.evaluaciones.values()]));
  const mapa = {};
  for (const e of lista) mapa[e.semana] = e;
  return mapa;
}

async function guardarEvaluacion(evaluacion) {
  const fila = { ...evaluacion, guardado: new Date().toISOString() };
  await operar('evaluaciones', 'readwrite', (s) => {
    if (!s) { memoria.evaluaciones.set(fila.semana, fila); return null; }
    return promesa(s.put(fila));
  });
  await marcarGuardado();
  return fila;
}

// ---------- Área privada ----------
// Almacén separado. No se mezcla con los registros de entrenamiento.

async function leerPracticas() {
  const lista = await operar('privado', 'readonly', (s) => (s ? promesa(s.getAll()) : [...memoria.privado.values()]));
  return lista.sort((a, b) => b.id.localeCompare(a.id)); // más recientes primero
}

async function guardarPractica(practica) {
  const fila = { ...practica, guardado: new Date().toISOString() };
  await operar('privado', 'readwrite', (s) => {
    if (!s) { memoria.privado.set(fila.id, fila); return null; }
    return promesa(s.put(fila));
  });
  await marcarGuardado();
  return fila;
}

async function borrarPractica(id) {
  await operar('privado', 'readwrite', (s) => {
    if (!s) { memoria.privado.delete(id); return null; }
    return promesa(s.delete(id));
  });
  await marcarGuardado();
}

async function borrarPracticas() {
  await operar('privado', 'readwrite', (s) => {
    if (!s) { memoria.privado.clear(); return null; }
    return promesa(s.clear());
  });
  await marcarGuardado();
}

// ---------- Copias de seguridad ----------

async function exportarTodo({ incluirPrivado = false } = {}) {
  const ajustes = await leerAjustes();
  const registros = await leerRegistros();
  const copia = {
    app: ID_APP,
    formato: FORMATO_COPIA,
    exportado: new Date().toISOString(),
    ajustes,
    registros: Object.values(registros).sort((a, b) => a.fecha.localeCompare(b.fecha)),
    evaluaciones: Object.values(await leerEvaluaciones()).sort((a, b) => a.semana.localeCompare(b.semana)),
  };
  if (incluirPrivado) copia.privado = (await leerPracticas()).reverse();
  return copia;
}

const FECHA = /^\d{4}-\d{2}-\d{2}$/;

// Comprueba que un archivo de copia tiene la forma esperada antes de tocar nada.
function validarCopia(datos) {
  if (!datos || typeof datos !== 'object') return { ok: false, error: 'El archivo no contiene datos válidos.' };
  if (datos.app !== ID_APP) return { ok: false, error: 'Este archivo no es una copia de esta app.' };
  if (datos.formato !== FORMATO_COPIA) return { ok: false, error: `Formato de copia no compatible (${datos.formato}).` };
  if (!datos.ajustes || typeof datos.ajustes !== 'object') return { ok: false, error: 'Faltan los ajustes en la copia.' };
  if (!Array.isArray(datos.registros)) return { ok: false, error: 'Faltan los registros en la copia.' };
  for (const r of datos.registros) {
    if (!r || !FECHA.test(r.fecha) || typeof r.actividades !== 'object' || r.actividades === null) {
      return { ok: false, error: 'Hay un registro con un formato incorrecto. No se ha importado nada.' };
    }
  }
  if (datos.evaluaciones !== undefined) {
    if (!Array.isArray(datos.evaluaciones) || datos.evaluaciones.some((e) => !e || !FECHA.test(e.semana))) {
      return { ok: false, error: 'Las evaluaciones semanales de la copia tienen un formato incorrecto.' };
    }
  }
  if (datos.privado !== undefined) {
    if (!Array.isArray(datos.privado)) return { ok: false, error: 'La parte privada de la copia tiene un formato incorrecto.' };
    for (const p of datos.privado) {
      if (!p || typeof p.id !== 'string' || !FECHA.test(p.fecha)) {
        return { ok: false, error: 'Hay una práctica privada con un formato incorrecto. No se ha importado nada.' };
      }
    }
  }
  return { ok: true, dias: datos.registros.length, practicas: Array.isArray(datos.privado) ? datos.privado.length : null };
}

// Reemplaza todos los datos por los de la copia (en una sola operación).
// Si la copia no incluye la parte privada, el historial privado actual se conserva tal cual.
async function importarTodo(datos) {
  const v = validarCopia(datos);
  if (!v.ok) throw new Error(v.error);
  if (modoTemporal || !conexion) {
    memoria.registros.clear();
    for (const r of datos.registros) memoria.registros.set(r.fecha, r);
    memoria.ajustes.set('principal', { clave: 'principal', valor: { ...datos.ajustes } });
    memoria.evaluaciones.clear();
    for (const e of datos.evaluaciones || []) memoria.evaluaciones.set(e.semana, e);
    if (Array.isArray(datos.privado)) {
      memoria.privado.clear();
      for (const p of datos.privado) memoria.privado.set(p.id, p);
    }
  } else {
    const tx = conexion.transaction(['registros', 'ajustes', 'privado', 'evaluaciones'], 'readwrite');
    const evs = tx.objectStore('evaluaciones');
    evs.clear();
    for (const e of datos.evaluaciones || []) evs.put(e);
    const regs = tx.objectStore('registros');
    regs.clear();
    for (const r of datos.registros) regs.put(r);
    tx.objectStore('ajustes').put({ clave: 'principal', valor: { ...datos.ajustes } });
    if (Array.isArray(datos.privado)) {
      const priv = tx.objectStore('privado');
      priv.clear();
      for (const p of datos.privado) priv.put(p);
    }
    await new Promise((resolve, reject) => {
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Importación cancelada'));
    });
  }
  await marcarGuardado();
  return v.dias;
}

async function borrarTodo() {
  if (modoTemporal || !conexion) {
    memoria.registros.clear();
    memoria.ajustes.clear();
    memoria.privado.clear();
    memoria.evaluaciones.clear();
  } else {
    const tx = conexion.transaction(['registros', 'ajustes', 'privado', 'evaluaciones'], 'readwrite');
    tx.objectStore('evaluaciones').clear();
    tx.objectStore('registros').clear();
    tx.objectStore('ajustes').clear();
    tx.objectStore('privado').clear();
    await new Promise((resolve, reject) => {
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  avisarGuardado(null);
}

// ---- js/logic/esqueleto.js ----
// Geometría de las figuras: convierte una pose (ángulos de cada segmento) en puntos 2D.
// Ángulos en grados, absolutos: 0 = hacia abajo, 90 = hacia la derecha, 180 = hacia arriba, -90 = hacia la izquierda.
// La figura mira a la derecha. "2" indica el lado lejano (brazo2, muslo2…); si falta, copia el cercano.

const SUELO = 116; // línea del suelo en el dibujo (viewBox 240 × 130)
const APOYO = 112; // altura de los puntos apoyados (el trazo tiene 8 de grosor)

const LARGOS = { tronco: 36, cabeza: 15, brazo: 22, antebrazo: 20, muslo: 26, pierna: 26, pie: 9 };

const rad = (a) => (a * Math.PI) / 180;
const avanzar = (p, angulo, largo) => [p[0] + largo * Math.sin(rad(angulo)), p[1] + largo * Math.cos(rad(angulo))];

// Completa ángulos: piernas rectas alineadas con el tronco, brazos relativos al tronco, lado lejano.
function completar(p) {
  const q = { pie: 90, cuello: 0, ...p };
  if (q.recto) {
    if (q.muslo === undefined) q.muslo = q.tronco - 180;
    if (q.pierna === undefined) q.pierna = q.muslo;
  }
  const perp = q.tronco - 90; // perpendicular al tronco, hacia "abajo" del cuerpo
  if (q.brazoRel !== undefined) q.brazo = perp + q.brazoRel;
  if (q.antebrazoRel !== undefined) q.antebrazo = perp + q.antebrazoRel;
  for (const k of ['brazo', 'antebrazo', 'muslo', 'pierna', 'pie']) {
    if (q[`${k}2`] === undefined) q[`${k}2`] = q[k];
  }
  return q;
}

function puntos(p) {
  const cadera = [0, 0];
  const hombro = avanzar(cadera, p.tronco, LARGOS.tronco);
  const cabeza = avanzar(hombro, p.tronco + p.cuello, LARGOS.cabeza);
  const lado = (s) => {
    const codo = avanzar(hombro, p[`brazo${s}`], LARGOS.brazo);
    const mano = avanzar(codo, p[`antebrazo${s}`], LARGOS.antebrazo);
    const rodilla = avanzar(cadera, p[`muslo${s}`], LARGOS.muslo);
    const tobillo = avanzar(rodilla, p[`pierna${s}`], LARGOS.pierna);
    const pie = avanzar(tobillo, p[`pie${s}`], LARGOS.pie);
    return { codo, mano, rodilla, tobillo, pie };
  };
  const cerca = lado('');
  const lejos = lado('2');
  return {
    cadera, hombro, cabeza, ...cerca,
    codo2: lejos.codo, mano2: lejos.mano, rodilla2: lejos.rodilla, tobillo2: lejos.tobillo, pie2: lejos.pie,
  };
}

function desplazar(pts, dx, dy) {
  const r = {};
  for (const [k, v] of Object.entries(pts)) r[k] = [v[0] + dx, v[1] + dy];
  return r;
}

function anclar(pts, ancla) {
  if (!ancla) return pts;
  const [x, y] = pts[ancla.punto];
  return desplazar(pts, ancla.en[0] - x, ancla.en[1] - y);
}

function calcular(p) {
  return anclar(puntos(completar(p)), p.ancla);
}

function distancia(pt, objetivo) {
  const dx = objetivo[0] === null || objetivo[0] === undefined ? 0 : pt[0] - objetivo[0];
  const dy = objetivo[1] === null || objetivo[1] === undefined ? 0 : pt[1] - objetivo[1];
  return Math.hypot(dx, dy);
}

const grados = (r) => (r * 180) / Math.PI;

// Brazo por cinemática inversa: coloca la mano en "objetivo" (coordenadas o nombre de un punto,
// p. ej. 'tobillo') y dobla el codo hacia el lado indicado ('izquierda', 'derecha', 'arriba', 'abajo').
function colocarMano(pose, pts, ik) {
  const S = pts.hombro;
  const T = typeof ik.objetivo === 'string' ? pts[ik.objetivo] : ik.objetivo;
  const L1 = LARGOS.brazo;
  const L2 = LARGOS.antebrazo;
  const dx = T[0] - S[0];
  const dy = T[1] - S[1];
  const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(L1 - L2) + 0.01), L1 + L2 - 0.01);
  const base = grados(Math.atan2(dx, dy));
  const alfa = grados(Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
  const opciones = [base + alfa, base - alfa].map((brazo) => {
    const E = avanzar(S, brazo, L1);
    return { brazo, E, antebrazo: grados(Math.atan2(T[0] - E[0], T[1] - E[1])) };
  });
  const criterio = { izquierda: (o) => o.E[0], derecha: (o) => -o.E[0], arriba: (o) => o.E[1], abajo: (o) => -o.E[1] }[ik.codo || 'izquierda'];
  const elegido = opciones.sort((a, b) => criterio(a) - criterio(b))[0];
  const sufijo = ik.lado === 'lejos' ? '2' : '';
  const nueva = { ...pose, [`brazo${sufijo}`]: elegido.brazo, [`antebrazo${sufijo}`]: elegido.antebrazo };
  if (!sufijo) { delete nueva.brazoRel; delete nueva.antebrazoRel; }
  return nueva;
}

// Resuelve una pose. Con "ajuste", busca el ángulo (del tronco o de las piernas) que deja
// un punto (p. ej. la mano) lo más cerca posible de su objetivo (p. ej. el borde de la mesa o el suelo).
function resolverPose(pose) {
  const conIk = (r) => {
    if (!r.pose.ik) return r;
    let pose2 = r.pose;
    for (const ik of [].concat(r.pose.ik)) pose2 = colocarMano(pose2, calcular(pose2), ik);
    return { ...r, pose: pose2, puntos: calcular(pose2) };
  };
  if (!pose.ajuste) return conIk({ pose, puntos: calcular(pose) });
  const { variar, objetivo, en, rango = 60 } = pose.ajuste;
  const base = variar === 'piernas' ? pose.muslo : pose.tronco;
  let mejor = null;
  for (let d = -rango; d <= rango; d += 0.5) {
    const prueba = { ...pose };
    if (variar === 'piernas') {
      prueba.muslo = base + d;
      if (pose.piernaRel !== undefined) prueba.pierna = prueba.muslo + pose.piernaRel;
      else if (pose.recto || pose.pierna === undefined) prueba.pierna = prueba.muslo;
      if (pose.muslo2 !== undefined && pose.mismaPierna2) { prueba.muslo2 = prueba.muslo; prueba.pierna2 = prueba.pierna; }
    } else {
      prueba.tronco = base + d;
    }
    const pts = calcular(prueba);
    const error = distancia(pts[objetivo], en);
    if (!mejor || error < mejor.error) mejor = { error, pose: prueba, puntos: pts };
  }
  return conIk({ pose: mejor.pose, puntos: mejor.puntos, error: mejor.error });
}

// Resuelve las poses de una figura en orden. Un ancla con en: 'previa' se coloca donde
// quedó ese mismo punto en la pose anterior (p. ej. los pies no se mueven entre posiciones).
function resolverFigura(fig) {
  const resueltas = [];
  for (const pose of fig.poses) {
    let p = pose;
    if (p.ancla && p.ancla.en === 'previa' && resueltas.length) {
      p = { ...p, ancla: { ...p.ancla, en: resueltas[resueltas.length - 1].puntos[p.ancla.punto] } };
    }
    resueltas.push(resolverPose(p));
  }
  return resueltas;
}

const CLAVES_ANGULO = ['tronco', 'cuello', 'brazo', 'antebrazo', 'muslo', 'pierna', 'pie', 'brazo2', 'antebrazo2', 'muslo2', 'pierna2', 'pie2'];

const suave = (t) => t * t * (3 - 2 * t);

// Pose intermedia entre dos poses ya resueltas: se interpolan los ÁNGULOS (los segmentos no cambian de largo)
// y la posición del ancla. Así los apoyos fijos (manos, pies) se mantienen en su sitio.
function poseIntermedia(a, b, t) {
  const s = suave(t);
  const qa = completar(a);
  const qb = completar(b);
  const r = {};
  for (const k of CLAVES_ANGULO) r[k] = qa[k] + (qb[k] - qa[k]) * s;
  const anclaA = a.ancla || { punto: 'cadera', en: [0, 0] };
  const anclaB = b.ancla || anclaA;
  if (anclaA.punto === anclaB.punto) {
    r.ancla = { punto: anclaA.punto, en: [anclaA.en[0] + (anclaB.en[0] - anclaA.en[0]) * s, anclaA.en[1] + (anclaB.en[1] - anclaA.en[1]) * s] };
    return { pose: r, puntos: calcular(r) };
  }
  // Anclas distintas: se calcula cada extremo y se interpola la posición de la cadera.
  const pa = calcular(a);
  const pb = calcular(b);
  const cadera = [pa.cadera[0] + (pb.cadera[0] - pa.cadera[0]) * s, pa.cadera[1] + (pb.cadera[1] - pa.cadera[1]) * s];
  r.ancla = { punto: 'cadera', en: cadera };
  return { pose: r, puntos: calcular(r) };
}

function interpolarNumero(a, b, t) {
  return a + (b - a) * suave(t);
}

function nodo(tag, attrs = {}) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}

const f = (n) => n.toFixed(1);
const linea = (...pts) => `M${pts.map((p) => `${f(p[0])} ${f(p[1])}`).join(' L')}`;

function dibujarProps(svg, props = []) {
  svg.append(nodo('line', { x1: 6, x2: ANCHO - 6, y1: SUELO, y2: SUELO, class: 'fig-suelo' }));
  for (const p of props) {
    if (p.tipo === 'esterilla') svg.append(nodo('rect', { x: p.x1, y: SUELO - 2, width: p.x2 - p.x1, height: 3, rx: 1.5, class: 'fig-esterilla' }));
    if (p.tipo === 'mesa') {
      svg.append(nodo('rect', { x: p.x, y: p.y, width: p.ancho, height: 5, rx: 1.5, class: 'fig-mueble' }));
      svg.append(nodo('line', { x1: p.x + 5, x2: p.x + 5, y1: p.y + 5, y2: SUELO, class: 'fig-pata' }));
      svg.append(nodo('line', { x1: p.x + p.ancho - 5, x2: p.x + p.ancho - 5, y1: p.y + 5, y2: SUELO, class: 'fig-pata' }));
    }
    if (p.tipo === 'pared') svg.append(nodo('rect', { x: p.x, y: 8, width: 9, height: SUELO - 8, class: 'fig-mueble' }));
  }
}

// Crea los elementos del cuerpo una sola vez; luego "actualizar" solo cambia coordenadas.
function crearCuerpo(svg, resaltar) {
  const r = (parte) => (resaltar.includes(parte) ? ' fig-resaltado' : '');
  const el = {
    pierna2: nodo('path', { class: `fig-lejos${r('piernas')}` }),
    brazo2: nodo('path', { class: `fig-lejos${r('brazos')}` }),
    tronco: nodo('path', { class: `fig-tronco${r('tronco')}` }),
    abdomen: nodo('ellipse', { class: 'fig-abdomen' }),
    pierna: nodo('path', { class: `fig-cerca${r('piernas')}` }),
    brazo: nodo('path', { class: `fig-cerca${r('brazos')}` }),
    cabeza: nodo('circle', { r: 8, class: 'fig-cabeza' }),
    cadera: nodo('circle', { r: 6, class: 'fig-cadera' }),
    anillo: nodo('circle', { class: 'fig-anillo' }),
    pelvis: nodo('circle', { r: 3.5, class: 'fig-pelvis' }),
  };
  el.abdomen.style.display = resaltar.includes('abdomen') ? '' : 'none';
  el.cadera.style.display = resaltar.includes('cadera') ? '' : 'none';
  const conPelvis = resaltar.includes('pelvis');
  el.anillo.style.display = conPelvis ? '' : 'none';
  el.pelvis.style.display = conPelvis ? '' : 'none';
  svg.append(el.pierna2, el.brazo2, el.tronco, el.abdomen, el.pierna, el.brazo, el.cabeza, el.cadera, el.anillo, el.pelvis);
  return el;
}

function actualizar(el, p, extra) {
  el.pierna2.setAttribute('d', linea(p.cadera, p.rodilla2, p.tobillo2, p.pie2));
  el.brazo2.setAttribute('d', linea(p.hombro, p.codo2, p.mano2));
  el.pierna.setAttribute('d', linea(p.cadera, p.rodilla, p.tobillo, p.pie));
  el.brazo.setAttribute('d', linea(p.hombro, p.codo, p.mano));
  // Tronco con curva opcional (espalda redonda o hundida)
  const dx = p.hombro[0] - p.cadera[0];
  const dy = p.hombro[1] - p.cadera[1];
  const largo = Math.hypot(dx, dy) || 1;
  const nx = dy / largo;
  const ny = -dx / largo;
  const curva = extra.curva || 0;
  const cx = (p.cadera[0] + p.hombro[0]) / 2 + nx * curva * 2;
  const cy = (p.cadera[1] + p.hombro[1]) / 2 + ny * curva * 2;
  el.tronco.setAttribute('d', `M${f(p.cadera[0])} ${f(p.cadera[1])} Q${f(cx)} ${f(cy)} ${f(p.hombro[0])} ${f(p.hombro[1])}`);
  el.cabeza.setAttribute('cx', f(p.cabeza[0]));
  el.cabeza.setAttribute('cy', f(p.cabeza[1]));
  el.cadera.setAttribute('cx', f(p.cadera[0]));
  el.cadera.setAttribute('cy', f(p.cadera[1]));
  // Abdomen: crece al tomar aire
  const ab = extra.abdomen || 0;
  el.abdomen.setAttribute('cx', f((p.cadera[0] + p.hombro[0]) / 2 + 2));
  el.abdomen.setAttribute('cy', f((p.cadera[1] + p.hombro[1]) / 2 - 3 - 3 * ab));
  el.abdomen.setAttribute('rx', f(10 + 2 * ab));
  el.abdomen.setAttribute('ry', f(2.5 + 4 * ab));
  // Suelo pélvico: >0 contracción (sube y se ilumina), <0 relajación (baja y se suelta)
  const v = extra.pelvis || 0;
  const px = p.cadera[0] + 4;
  const py = p.cadera[1] + 1 - 2.5 * v;
  el.pelvis.setAttribute('cx', f(px));
  el.pelvis.setAttribute('cy', f(py));
  el.pelvis.style.opacity = String(0.35 + 0.65 * Math.abs(v));
  el.anillo.setAttribute('cx', f(px));
  el.anillo.setAttribute('cy', f(py));
  el.anillo.setAttribute('r', f(4 + 6 * Math.abs(v)));
  el.anillo.style.opacity = String(0.8 * Math.abs(v));
}

function extras(pose) {
  return { curva: pose.curva || 0, abdomen: pose.abdomen || 0, pelvis: pose.pelvis || 0 };
}

function lienzo(etiqueta) {
  return nodo('svg', { viewBox: `0 0 ${ANCHO} ${ALTO}`, class: 'fig-svg', role: 'img', 'aria-label': etiqueta });
}

function estatico(fig, i, resueltas, nombre) {
  const etiquetas = fig.etiquetas || ['Posición inicial', 'Posición final'];
  const svg = lienzo(`${nombre}: ${etiquetas[i]}`);
  if (fig.error === i) svg.classList.add('es-error');
  dibujarProps(svg, fig.props);
  actualizar(crearCuerpo(svg, fig.resaltar || []), resueltas[i].puntos, extras(fig.poses[i]));
  const cuadro = document.createElement('div');
  cuadro.className = 'fig-cuadro';
  const pie = document.createElement('p');
  pie.className = `fig-etiqueta activa${fig.error === i ? ' error' : ''}`;
  pie.textContent = etiquetas[i];
  cuadro.append(svg, pie);
  return cuadro;
}

function crearFigura(fig, nombre) {
  const resueltas = resolverFigura(fig);
  const etiquetas = fig.etiquetas || ['Posición inicial', 'Posición final'];
  const figura = document.createElement('figure');
  figura.className = 'figura-ej';

  let reducir = false;
  try { reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { /* sin soporte */ }

  if (reducir) {
    figura.classList.add('estatica');
    figura.append(estatico(fig, 0, resueltas, nombre), estatico(fig, 1, resueltas, nombre));
    return figura;
  }

  const svg = lienzo(`${nombre}: animación entre «${etiquetas[0]}» y «${etiquetas[1]}»`);
  dibujarProps(svg, fig.props);
  const cuerpo = crearCuerpo(svg, fig.resaltar || []);
  const [A, B] = resueltas;
  const exA = extras(fig.poses[0]);
  const exB = extras(fig.poses[1]);
  actualizar(cuerpo, A.puntos, exA);

  const etqA = document.createElement('span');
  const etqB = document.createElement('span');
  etqA.textContent = etiquetas[0];
  etqB.textContent = etiquetas[1];
  etqA.className = `fig-etiqueta${fig.error === 0 ? ' error' : ''}`;
  etqB.className = `fig-etiqueta${fig.error === 1 ? ' error' : ''}`;
  const boton = document.createElement('button');
  boton.type = 'button';
  boton.className = 'fig-boton';
  boton.textContent = 'Pausar';
  boton.setAttribute('aria-pressed', 'false');

  const { mover = 1200, pausa = 700 } = fig.tiempo || {};
  const ciclo = 2 * (mover + pausa);
  let inicio = null;
  let pausado = false;
  let enPausaDesde = 0;
  let marcado = -1;

  const marcar = (i) => {
    if (i === marcado) return;
    marcado = i;
    etqA.classList.toggle('activa', i === 0);
    etqB.classList.toggle('activa', i === 1);
    svg.classList.toggle('es-error', fig.error === i);
  };

  const fotograma = (ahora) => {
    if (!svg.isConnected) return; // la pantalla cambió: se detiene la animación
    if (inicio === null) inicio = ahora;
    if (!pausado && !document.hidden) {
      const t = (ahora - inicio) % ciclo;
      let haciaB;
      let progreso;
      if (t < pausa) { haciaB = true; progreso = 0; marcar(0); }
      else if (t < pausa + mover) { haciaB = true; progreso = (t - pausa) / mover; marcar(progreso > 0.5 ? 1 : 0); }
      else if (t < 2 * pausa + mover) { haciaB = false; progreso = 0; marcar(1); }
      else { haciaB = false; progreso = (t - 2 * pausa - mover) / mover; marcar(progreso > 0.5 ? 0 : 1); }
      const [desde, hasta, exD, exH] = haciaB ? [A, B, exA, exB] : [B, A, exB, exA];
      const pts = progreso === 0 ? desde.puntos : poseIntermedia(desde.pose, hasta.pose, progreso).puntos;
      actualizar(cuerpo, pts, {
        curva: interpolarNumero(exD.curva, exH.curva, progreso),
        abdomen: interpolarNumero(exD.abdomen, exH.abdomen, progreso),
        pelvis: interpolarNumero(exD.pelvis, exH.pelvis, progreso),
      });
    }
    requestAnimationFrame(fotograma);
  };

  boton.addEventListener('click', () => {
    pausado = !pausado;
    if (pausado) enPausaDesde = performance.now();
    else if (inicio !== null) inicio += performance.now() - enPausaDesde;
    boton.textContent = pausado ? 'Reproducir' : 'Pausar';
    boton.setAttribute('aria-pressed', String(pausado));
  });

  const pieFigura = document.createElement('figcaption');
  pieFigura.className = 'fig-pie';
  const textos = document.createElement('div');
  textos.className = 'fig-textos';
  textos.append(etqA, etqB);
  pieFigura.append(textos, boton);
  figura.append(svg, pieFigura);
  marcar(0);
  requestAnimationFrame(fotograma);
  return figura;
}

// Para pruebas y revisión: las dos posiciones quietas.
function crearFiguraEstatica(fig, nombre) {
  const resueltas = resolverFigura(fig);
  const figura = document.createElement('figure');
  figura.className = 'figura-ej estatica';
  figura.append(estatico(fig, 0, resueltas, nombre), estatico(fig, 1, resueltas, nombre));
  return figura;
}

// Piezas reutilizables de la interfaz: creación de elementos, iconos, avisos y confirmaciones.


function h(tag, attrs = {}, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = Boolean(v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  agregar(el, hijos);
  return el;
}

function agregar(el, hijos) {
  for (const c of hijos.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function icono(nombre, clase = '') {
  const span = document.createElement('span');
  span.className = `icono ${clase}`.trim();
  span.setAttribute('aria-hidden', 'true');
  span.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS[nombre] || ''}</svg>`;
  return span;
}

function etiqueta(texto, tono = 'neutro') {
  return h('span', { class: `etiqueta etiqueta-${tono}` }, texto);
}

function barraProgreso(valor, total, etiquetaAccesible) {
  const pct = total > 0 ? Math.round((valor / total) * 100) : 0;
  return h('div', { class: 'barra', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(valor), 'aria-label': etiquetaAccesible },
    h('span', { style: `width:${pct}%` }));
}

// Mensaje breve en la parte inferior.
let temporizadorToast = null;
function avisar(texto, tono = 'ok') {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = texto;
  toast.className = `toast toast-${tono} visible`;
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => { toast.className = 'toast'; }, 3200);
}

// Ventana de confirmación propia (no depende de confirm() del navegador).
function confirmar({ titulo, mensaje, textoConfirmar = 'Confirmar', peligro = false }) {
  return new Promise((resolve) => {
    const capa = document.getElementById('capa-modal');
    const anterior = document.activeElement;
    const cerrar = (resultado) => {
      capa.replaceChildren();
      capa.hidden = true;
      document.removeEventListener('keydown', teclas);
      if (anterior && anterior.focus) anterior.focus();
      resolve(resultado);
    };
    const teclas = (e) => { if (e.key === 'Escape') cerrar(false); };
    const botonCancelar = h('button', { class: 'boton boton-secundario', type: 'button', onclick: () => cerrar(false) }, 'Cancelar');
    const dialogo = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-titulo' },
      h('h2', { id: 'modal-titulo' }, titulo),
      h('p', {}, mensaje),
      h('div', { class: 'modal-acciones' },
        botonCancelar,
        h('button', { class: `boton ${peligro ? 'boton-peligro' : 'boton-principal'}`, type: 'button', onclick: () => cerrar(true) }, textoConfirmar)));
    capa.replaceChildren(h('div', { class: 'modal-fondo', onclick: () => cerrar(false) }), dialogo);
    capa.hidden = false;
    document.addEventListener('keydown', teclas);
    botonCancelar.focus();
  });
}

// Grupo de opciones tipo "botones segmentados" (accesible como radio).
function opciones({ nombre, leyenda, valores, actual, alCambiar }) {
  const grupo = h('fieldset', { class: 'opciones' }, h('legend', {}, leyenda));
  const fila = h('div', { class: 'opciones-fila' });
  valores.forEach(([valor, texto], i) => {
    const id = `${nombre}-${i}`;
    const input = h('input', { type: 'radio', name: nombre, id, value: valor, checked: actual === valor, onchange: () => alCambiar(valor) });
    fila.append(h('div', { class: 'opcion' }, input, h('label', { for: id }, texto)));
  });
  grupo.append(fila);
  return grupo;
}

// Recurso visual de un ejercicio: imagen o vídeo propios si existen; si no, la figura animada;
// si tampoco hay figura, un aviso claro de que la ilustración está pendiente.
function medio(media, nombre, id) {
  if (media && media.tipo === 'imagen' && media.src) {
    return h('figure', { class: 'medio' }, h('img', { src: media.src, alt: media.alt || nombre, loading: 'lazy' }));
  }
  if (media && media.tipo === 'video' && media.src) {
    return h('figure', { class: 'medio' }, h('video', { src: media.src, muted: true, loop: true, playsinline: true, controls: true, preload: 'metadata', 'aria-label': media.alt || nombre }));
  }
  const fig = id ? figuraDe(id) : null;
  if (fig) return crearFigura(fig, nombre);
  const figura = h('figure', { class: 'medio medio-pendiente' });
  figura.innerHTML = `<svg viewBox="0 0 120 80" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="18" r="7"/><path d="M60 25v24M60 33l-14 10M60 33l14 10M60 49l-10 20M60 49l10 20"/><path d="M14 72h92" stroke-dasharray="4 5"/></g></svg>`;
  figura.append(h('figcaption', {}, h('strong', {}, 'Ilustración pendiente'), ' — se añadirá en la fase de recursos visuales. Mientras tanto, guíate por los pasos de abajo.'));
  return figura;
}
