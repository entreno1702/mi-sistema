      casillaPrivado,
      h('button', { class: 'boton boton-principal', type: 'button', onclick: descargar }, icono('descarga'), 'Descargar copia (archivo .json)'),
      h('button', { class: 'boton boton-secundario', type: 'button', onclick: mostrarTexto }, 'Mostrar copia como texto'),
      h('p', { class: 'ayuda' }, 'Si el botón de descarga no hace nada (pasa en la vista previa dentro de Claude), usa «Mostrar copia como texto».'),
      zonaTexto),
    h('h3', { class: 'h4' }, 'Recuperar una copia'),
    h('div', { class: 'campo' }, h('label', { for: idArchivo }, 'Elegir archivo de copia (.json)'),
      h('input', { id: idArchivo, type: 'file', accept: '.json,application/json', onchange: (e) => {
        const archivo = e.target.files && e.target.files[0];
        if (!archivo) return;
        const lector = new FileReader();
        lector.onload = () => importar(String(lector.result));
        lector.onerror = () => { estadoImportar.textContent = 'No se pudo leer el archivo.'; estadoImportar.hidden = false; };
        lector.readAsText(archivo);
        e.target.value = '';
      } })),
    h('div', { class: 'campo' }, h('label', { for: idPegar }, 'O pega el texto de una copia'), areaPegar),
    h('button', { class: 'boton boton-secundario', type: 'button', onclick: () => importar(areaPegar.value) }, icono('subida'), 'Importar texto pegado'),
    estadoImportar));

  // Borrar todo
  raiz.append(h('section', { class: 'tarjeta tarjeta-peligro' },
    h('h2', { class: 'h3' }, 'Borrar todos los datos'),
    h('p', { class: 'apagado' }, 'Elimina de este dispositivo tu fecha de inicio, todos tus registros y el área privada. No se puede deshacer.'),
    h('button', { class: 'boton boton-peligro', type: 'button', onclick: async () => {
      const paso1 = await confirmar({ titulo: '¿Borrar todos tus datos?', mensaje: 'Se eliminarán todos tus registros y ajustes de este dispositivo. Si quieres conservarlos, descarga antes una copia.', textoConfirmar: 'Continuar', peligro: true });
      if (!paso1) return;
      const paso2 = await confirmar({ titulo: 'Confirmación final', mensaje: 'Esta acción no se puede deshacer. ¿Borrar definitivamente?', textoConfirmar: 'Sí, borrar todo', peligro: true });
      if (!paso2) return;
      await borrarTodo();
      olvidarPracticasEnMemoria();
      await ctx.recargarDatos();
      avisar('Todos los datos se han borrado');
      ctx.navegar('#/hoy');
    } }, icono('papelera'), 'Borrar todo')));

  // Privacidad
  raiz.append(h('section', { class: 'tarjeta' },
    h('h2', { class: 'h3' }, 'Privacidad'),
    h('ul', { class: 'vinetas' },
      h('li', {}, 'Tus registros se guardan solo en este navegador y este dispositivo.'),
      h('li', {}, 'La app no usa servidor, cuentas, analíticas ni publicidad, y no envía tus datos a ningún sitio.'),
      h('li', {}, 'Cuando la publiquemos, su dirección web será pública: cualquiera podría abrir la app vacía, pero no verá tus datos.'),
      h('li', {}, 'Cualquier persona con acceso a tu teléfono desbloqueado podría abrir la app. Más adelante valoraremos un bloqueo, explicando qué protege y qué no.'))));

  raiz.append(h('p', { class: 'pie' }, 'Mi Sistema Personal · versión 0.6 (prototipo, Fase 5)'));
  return raiz;
}

function todayISOde(fechaHora) {
  return todayISO(new Date(fechaHora));
}

// Instalación en el teléfono y estado del modo sin conexión, explicados según cada caso.
function tarjetaInstalar() {
  const pwa = leerEstadoPwa();
  const tarjeta = h('section', { class: 'tarjeta', 'aria-labelledby': 'titulo-instalar' },
    h('h2', { class: 'h3', id: 'titulo-instalar' }, 'Instalar y usar sin internet'));

  let estado;
  if (pwa.motivo === 'vista-previa') {
    estado = h('p', { class: 'estado-pwa pendiente' }, icono('info'), h('span', {}, 'No disponible en la vista previa dentro de Claude. Se activará cuando la app esté publicada en su propia dirección web (Fase 7).'));
  } else if (pwa.motivo === 'sin-soporte' || pwa.motivo === 'no-seguro') {
    estado = h('p', { class: 'estado-pwa pendiente' }, icono('alerta'), h('span', {}, 'Este navegador o esta dirección no permiten el modo sin conexión. Abre la app publicada en Chrome.'));
  } else if (pwa.motivo === 'error') {
    estado = h('p', { class: 'estado-pwa pendiente' }, icono('alerta'), h('span', {}, 'No se pudo preparar el modo sin conexión. Recarga la página con internet.'));
  } else if (pwa.listaSinConexion) {
    estado = h('p', { class: 'estado-pwa ok' }, icono('check'), h('span', {}, 'Lista para usar sin internet en este dispositivo.'));
  } else {
    estado = h('p', { class: 'estado-pwa pendiente' }, icono('reloj'), h('span', {}, 'Preparando el modo sin conexión…'));
  }
  tarjeta.append(estado);

  if (pwa.actualizacion) {
    tarjeta.append(h('button', { class: 'boton boton-principal', type: 'button', onclick: aplicarActualizacion }, 'Actualizar a la versión nueva'));
  }

  if (pwa.instalada) {
    tarjeta.append(h('p', {}, 'La app ya está instalada en este dispositivo.'));
  } else if (pwa.avisoInstalar) {
    tarjeta.append(h('button', { class: 'boton boton-principal', type: 'button', onclick: async () => {
      const r = await instalar();
      if (r === 'accepted') avisar('Instalando la app…');
    } }, icono('descarga'), 'Instalar en este dispositivo'));
  } else if (pwa.motivo !== 'vista-previa') {
    tarjeta.append(h('div', {},
      h('p', { class: 'apagado' }, 'Para instalarla en Android con Chrome:'),
      h('ol', { class: 'pasos' },
        h('li', {}, 'Abre la app en Chrome.'),
        h('li', {}, 'Pulsa el menú ⋮ (arriba a la derecha).'),
        h('li', {}, 'Elige «Instalar aplicación» o «Añadir a pantalla de inicio».'),
        h('li', {}, 'Confirma. Aparecerá el icono amarillo y negro en tu pantalla.'))));
  }
  tarjeta.append(h('p', { class: 'pie' }, 'Tus datos no cambian al instalar ni al actualizar: siguen guardados en este dispositivo.', pwa.version ? ` Versión ${pwa.version}.` : ''));
  return tarjeta;
}

// ---- js/app.js ----
// Punto de entrada: carga los datos guardados, decide qué pantalla mostrar según la dirección
// (#/hoy, #/semana/…, #/dia/…, #/ejercicios, #/ejercicio/…, #/historial, #/ajustes) y la dibuja.


const estadoApp = {
  ajustes: { inicio: null },
  registros: {},
  ultimoGuardado: null,
  evaluaciones: {},
  rutaAnterior: null,
};

const contenedor = document.getElementById('vista');
const marcaGuardado = document.getElementById('estado-guardado');

function rutaActual() {
  const partes = (location.hash || '#/hoy').replace(/^#\/?/, '').split('/');
  return { nombre: partes[0] || 'hoy', param: partes[1] ? decodeURIComponent(partes[1]) : null, ancla: partes[2] || null };
}

function navegar(destino) {
  if (location.hash === destino) dibujar();
  else location.hash = destino;
}

const ctx = {
  get hoy() { return todayISO(); },
  get ajustes() { return estadoApp.ajustes; },
  get registros() { return estadoApp.registros; },
  get ultimoGuardado() { return estadoApp.ultimoGuardado; },
  get evaluaciones() { return estadoApp.evaluaciones; },
  async guardarEvaluacion(ev) {
    const fila = await guardarEvaluacion(ev);
    estadoApp.evaluaciones = { ...estadoApp.evaluaciones, [fila.semana]: fila };
    dibujar({ conservarScroll: false });
  },
  navegar,
  redibujar: () => dibujar({ conservarScroll: true }),
  async guardarAjustes(nuevos) {
    estadoApp.ajustes = await guardarAjustes(nuevos);
    dibujar({ conservarScroll: true });
  },
  // Guarda (o borra, si entrada es null) el registro de una actividad en un día.
  async guardarEntrada(fecha, idActividad, entrada) {
    const actual = estadoApp.registros[fecha] || { fecha, actividades: {} };
    const actividades = { ...actual.actividades };
    if (entrada) actividades[idActividad] = entrada;
    else delete actividades[idActividad];
    if (Object.keys(actividades).length === 0) {
      await borrarRegistro(fecha);
      delete estadoApp.registros[fecha];
    } else {
      estadoApp.registros[fecha] = await guardarRegistro({ fecha, actividades });
    }
    dibujar({ conservarScroll: true });
  },
  async recargarDatos() {
    olvidarPracticasEnMemoria();
    estadoApp.ajustes = await leerAjustes();
    estadoApp.registros = await leerRegistros();
    estadoApp.ultimoGuardado = await leerUltimoGuardado();
    estadoApp.evaluaciones = await leerEvaluaciones();
    dibujar();
  },
};

const VISTAS = {
  hoy: () => vistaInicio(ctx),
  semana: (p) => vistaSemana(ctx, p),
  dia: (p) => vistaDia(ctx, p),
  ejercicios: () => vistaCatalogo(),
  ejercicio: (p) => vistaFicha(p),
  historial: () => vistaHistorial(ctx),
  ajustes: () => vistaAjustes(ctx),
  privado: (p) => vistaPrivado(ctx, p),
  evaluacion: (p) => vistaEvaluacion(ctx, p),
  progreso: (p) => vistaProgreso(ctx, p),
  reglas: () => vistaReglas(ctx),
};

// Pestaña de la barra inferior que corresponde a cada pantalla.
const PESTANA = { hoy: 'hoy', semana: 'semana', dia: 'semana', ejercicios: 'ejercicios', ejercicio: 'ejercicios', historial: 'historial', ajustes: 'ajustes', privado: 'ajustes', evaluacion: 'historial', progreso: 'historial', reglas: 'ajustes' };

function dibujar({ conservarScroll = false } = {}) {
  const ruta = rutaActual();
  const vista = VISTAS[ruta.nombre];
  const scroll = window.scrollY;
  let nodo;
  try {
    nodo = vista ? vista(ruta.param) : h('div', { class: 'pila' }, h('h1', {}, 'Página no encontrada'), h('a', { class: 'boton boton-secundario', href: '#/hoy' }, 'Ir a Hoy'));
  } catch (error) {
    console.error(error);
    nodo = h('div', { class: 'pila' },
      h('h1', {}, 'Algo salió mal al mostrar esta pantalla'),
      h('p', {}, 'Tus datos guardados no se han tocado. Prueba a volver al inicio.'),
      h('a', { class: 'boton boton-secundario', href: '#/hoy' }, 'Ir a Hoy'));
  }
  contenedor.replaceChildren(nodo);

  const claveRuta = `${ruta.nombre}/${ruta.param || ''}/${ruta.ancla || ''}`;
  const destino = ruta.ancla ? document.getElementById(`sec-${ruta.ancla}`) : null;
  if (conservarScroll && estadoApp.rutaAnterior === claveRuta) window.scrollTo(0, scroll);
  else if (destino) { destino.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); }
  else { window.scrollTo(0, 0); contenedor.focus({ preventScroll: true }); }
  estadoApp.rutaAnterior = claveRuta;

  for (const enlace of document.querySelectorAll('.pestanas a')) {
    const activa = enlace.dataset.pestana === PESTANA[ruta.nombre];
    enlace.classList.toggle('activa', activa);
    if (activa) enlace.setAttribute('aria-current', 'page'); else enlace.removeAttribute('aria-current');
  }
}

function pintarGuardado(fechaHora) {
  if (esModoTemporal()) {
    marcaGuardado.textContent = 'Sin guardado';
    marcaGuardado.className = 'estado-guardado sin-guardado';
    return;
  }
  marcaGuardado.textContent = fechaHora ? `Guardado ${formatTime(fechaHora)}` : 'Sin cambios';
  marcaGuardado.className = 'estado-guardado';
}

window.addEventListener('datos-guardados', (e) => {
  estadoApp.ultimoGuardado = e.detail.fechaHora;
  pintarGuardado(e.detail.fechaHora);
});
window.addEventListener('hashchange', () => dibujar());

// Estado de instalación y conexión: indicador en la cabecera, aviso de versión nueva
// y, si se está viendo Ajustes, se vuelve a dibujar para mostrar el estado actual.
window.addEventListener('pwa-cambio', () => {
  const pwa = leerEstadoPwa();
  document.getElementById('sin-conexion').hidden = pwa.enLinea;
  document.getElementById('aviso-version').hidden = !pwa.actualizacion;
  if (rutaActual().nombre === 'ajustes') dibujar({ conservarScroll: true });
});
document.getElementById('boton-actualizar').addEventListener('click', aplicarActualizacion);

// Si la app queda abierta y cambia el día, se vuelve a dibujar con la fecha nueva.
let diaVisto = todayISO();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && todayISO() !== diaVisto) {
    diaVisto = todayISO();
    dibujar();
  }
});

async function arrancar() {
  await iniciarAlmacen();
  await ctx.recargarDatos();
  pintarGuardado(estadoApp.ultimoGuardado);
  iniciarPwa();
}

arrancar().catch((error) => {
  console.error(error);
  contenedor.replaceChildren(h('div', { class: 'pila' },
    h('h1', {}, 'No se pudo iniciar la app'),
    h('p', {}, 'Recarga la página. Si el problema continúa, avisa con este mensaje: ', String(error.message || error))));
});

</script>
