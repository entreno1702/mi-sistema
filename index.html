// ---- js/logic/dates.js ----
// Utilidades de fechas. Todas las fechas se guardan como texto "AAAA-MM-DD" en hora local,
// para que un registro no cambie de día por la zona horaria.

const DIAS_NOMBRE = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const DIAS_CORTOS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function isValidISO(iso) {
  if (typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d, 12);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

function toISO(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function parseISO(iso) {
  if (!isValidISO(iso)) throw new Error(`Fecha no válida: ${iso}`);
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d, 12); // mediodía: evita saltos por cambio de hora
}

function todayISO(now = new Date()) {
  return toISO(now);
}

function addDays(iso, n) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + n);
  return toISO(d);
}

// 0 = lunes … 6 = domingo
function weekdayIndex(iso) {
  return (parseISO(iso).getDay() + 6) % 7;
}

function mondayOf(iso) {
  return addDays(iso, -weekdayIndex(iso));
}

function weekDates(iso) {
  const lunes = mondayOf(iso);
  return Array.from({ length: 7 }, (_, i) => addDays(lunes, i));
}

function daysBetween(a, b) {
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}

// Semana del programa (1, 2, 3…). La semana 1 empieza el lunes de la semana de inicio.
// Devuelve null si no hay fecha de inicio o si la fecha es anterior a esa semana.
function programWeek(inicioISO, iso) {
  if (!inicioISO || !isValidISO(inicioISO)) return null;
  const diff = daysBetween(mondayOf(inicioISO), mondayOf(iso));
  if (diff < 0) return null;
  return diff / 7 + 1;
}

function formatLong(iso) {
  const d = parseISO(iso);
  return `${DIAS_NOMBRE[weekdayIndex(iso)]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
}

function formatShort(iso) {
  const d = parseISO(iso);
  return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`;
}

function formatMonth(iso) {
  const d = parseISO(iso);
  return `${MESES[d.getMonth()]} ${d.getFullYear()}`;
}

function formatTime(dateOrString) {
  const d = new Date(dateOrString);
  if (Number.isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function capitalize(text) {
  return text ? text[0].toUpperCase() + text.slice(1) : text;
}

// ---- js/logic/plan.js ----
// Lógica del plan: qué toca cada día, en qué estado está y qué avisos mostrar.
// No guarda nada: recibe los datos y devuelve resultados. Así se puede probar fácilmente.


const DURACION_CICLO = CICLO.reduce((t, f) => t + f.semanas, 0);

function phaseFor(semana) {
  if (!semana || semana < 1) return null;
  const ciclo = Math.floor((semana - 1) / DURACION_CICLO) + 1;
  let resto = (semana - 1) % DURACION_CICLO;
  for (const fase of CICLO) {
    if (resto < fase.semanas) {
      return { ...fase, ciclo, semanaEnFase: resto + 1 };
    }
    resto -= fase.semanas;
  }
  return null; // no debería ocurrir
}

function tipoRegistro(actividad) {
  const ej = getEjercicio(actividad.ejercicio);
  if (!ej || ej.disponible === false) return 'ninguno';
  if (ej.privado) return 'simple';
  if (actividad.series) return 'series';
  return 'tiempo';
}

// ---------- Rangos ("6–10", "15–25", "8") ----------

function parseRango(texto) {
  if (texto === null || texto === undefined) return null;
  const m = String(texto).trim().match(/^(\d+)\s*(?:[–-]\s*(\d+))?$/);
  if (!m) return null;
  const min = Number(m[1]);
  const max = m[2] ? Number(m[2]) : min;
  return max >= min ? { min, max } : null;
}

function formatoRango(r) {
  return r.min === r.max ? String(r.min) : `${r.min}–${r.max}`;
}

// Cambio del plan aceptado más reciente para un ejercicio que ya está vigente en esa fecha.
// Los cambios se guardan en ajustes.cambiosPlan = [{ id, ejercicio, desde, reps?, segundos?, motivo }].
function cambioVigente(ajustes, ejercicioId, fecha) {
  const lista = (ajustes && ajustes.cambiosPlan) || [];
  let elegido = null;
  for (const c of lista) {
    if (c.ejercicio !== ejercicioId || c.desde > fecha) continue;
    if (!elegido || c.desde > elegido.desde || (c.desde === elegido.desde && c.id > elegido.id)) elegido = c;
  }
  return elegido;
}

function aplicarCambio(a, ajustes, fecha) {
  const c = cambioVigente(ajustes, a.ejercicio, fecha);
  if (!c) return a;
  const nueva = { ...a, ajustado: { desde: c.desde, motivo: c.motivo, original: a.reps || a.segundos } };
  if (c.reps && a.reps) nueva.reps = c.reps;
  if (c.segundos && a.segundos) nueva.segundos = c.segundos;
  return nueva;
}

function dayPlan(iso, ajustes = {}) {
  const plantilla = PLAN_SEMANAL[weekdayIndex(iso)];
  const semana = programWeek(ajustes.inicio, iso);
  const antesDeInicio = Boolean(ajustes.inicio && iso < ajustes.inicio);
  const actividades = plantilla.actividades.map((a) => ({
    ...aplicarCambio(a, ajustes, iso),
    datos: getEjercicio(a.ejercicio),
    registro: tipoRegistro(a),
  }));
  const minutosObligatorios = actividades.filter((a) => a.obligatoria).reduce((t, a) => t + (a.minutos || 0), 0);
  const minutosOpcionales = actividades.filter((a) => !a.obligatoria).reduce((t, a) => t + (a.minutos || 0), 0);
  return {
    fecha: iso,
    diaSemana: weekdayIndex(iso),
    tipo: plantilla.tipo,
    tipoNombre: TIPOS_DIA[plantilla.tipo],
    titulo: plantilla.titulo,
    resumen: plantilla.resumen,
    actividades,
    minutosObligatorios,
    minutosOpcionales,
    semana,
    fase: phaseFor(semana),
    antesDeInicio,
  };
}

function groupBySection(actividades) {
  return SECCIONES.map((s) => ({ ...s, items: actividades.filter((a) => a.seccion === s.id) })).filter((s) => s.items.length);
}

function prescriptionText(a) {
  const partes = [];
  const lado = a.porLado ? ' por lado' : a.extra ? ` ${a.extra}` : '';
  if (a.series && a.reps) partes.push(`${a.series} ${a.series === 1 ? 'serie' : 'series'} × ${a.reps} rep.${lado}`);
  else if (a.series && a.segundos) partes.push(`${a.series} ${a.series === 1 ? 'serie' : 'series'} × ${a.segundos} s${lado}`);
  else if (a.minutos) partes.push(`${a.minutos} min`);
  if (a.descanso) partes.push(`descanso ${a.descanso}`);
  return partes.join(' · ');
}

// Estado de un día comparando lo previsto con lo registrado.
function dayStatus(plan, registro, hoy) {
  const entradas = (registro && registro.actividades) || {};
  let hechas = 0;
  let omitidas = 0;
  let obligatorias = 0;
  let obligatoriasHechas = 0;
  for (const a of plan.actividades) {
    const e = entradas[a.id];
    if (a.obligatoria) obligatorias += 1;
    if (e && e.estado === 'hecho') {
      hechas += 1;
      if (a.obligatoria) obligatoriasHechas += 1;
    } else if (e && e.estado === 'omitido') {
      omitidas += 1;
    }
  }
  let estado;
  if (plan.antesDeInicio) estado = 'antes';
  else if (hechas + omitidas > 0) {
    estado = obligatorias > 0 && obligatoriasHechas === obligatorias ? 'completo' : 'parcial';
  } else if (plan.fecha > hoy) estado = 'futuro';
  else if (plan.tipo === 'descanso') estado = 'descanso';
  else if (plan.fecha === hoy) estado = 'pendiente';
  else estado = 'sin-registro';
  return { hechas, omitidas, obligatorias, obligatoriasHechas, estado };
}

const ESTADOS_DIA = {
  antes: 'Antes del inicio',
  completo: 'Completo',
  parcial: 'Parcial',
  futuro: 'Previsto',
  descanso: 'Descanso',
  pendiente: 'Pendiente',
  'sin-registro': 'Sin registro',
};

function weekProgress(iso, ajustes, registros, hoy) {
  const dias = weekDates(iso).map((fecha) => {
    const plan = dayPlan(fecha, ajustes);
    return { fecha, plan, estado: dayStatus(plan, registros[fecha], hoy) };
  });
  const cuenta = dias.filter((d) => !d.plan.antesDeInicio);
  const obligatorias = cuenta.reduce((t, d) => t + d.estado.obligatorias, 0);
  const hechas = cuenta.reduce((t, d) => t + d.estado.obligatoriasHechas, 0);
  return { dias, obligatorias, hechas };
}

// Última fecha (hasta hoy incluido) con al menos una actividad marcada como hecha.
function lastSession(registros, hoy, ajustes = {}) {
  const fechas = Object.keys(registros).filter((f) => isValidISO(f) && f <= hoy).sort().reverse();
  for (const fecha of fechas) {
    const reg = registros[fecha];
    const plan = dayPlan(fecha, ajustes);
    const hechas = plan.actividades.filter((a) => reg.actividades?.[a.id]?.estado === 'hecho');
    if (hechas.length) {
      const molestias = hechas.filter((a) => ['moderada', 'fuerte'].includes(reg.actividades[a.id].molestias));
      return {
        fecha,
        plan,
        hechas,
        omitidas: plan.actividades.filter((a) => reg.actividades?.[a.id]?.estado === 'omitido'),
        molestias,
      };
    }
  }
  return null;
}

// Avisos de descanso y recuperación. Reglas simples y explicadas en el propio texto.
function avisos({ hoy, ajustes, registros }) {
  const lista = [];
  const plan = dayPlan(hoy, ajustes);

  if (plan.antesDeInicio) return lista;

  if (plan.tipo === 'descanso') {
    lista.push({ tono: 'info', texto: 'Hoy es día de descanso. Caminar suave o relajarte es opcional. No hace falta compensar sesiones perdidas.' });
  } else if (plan.tipo === 'recuperacion') {
    lista.push({ tono: 'info', texto: 'Día de recuperación: el objetivo es moverte suave, no cansarte.' });
  }

  // Molestias moderadas o fuertes en los últimos 3 días.
  for (let i = 0; i <= 3; i += 1) {
    const fecha = addDays(hoy, -i);
    const reg = registros[fecha];
    if (!reg || !reg.actividades) continue;
    const planDia = dayPlan(fecha, ajustes);
    for (const a of planDia.actividades) {
      const e = reg.actividades[a.id];
      if (e && ['moderada', 'fuerte'].includes(e.molestias)) {
        lista.push({
          tono: 'alerta',
          texto: `Registraste molestias ${e.molestias}s en «${a.datos?.nombre || a.ejercicio}» ${i === 0 ? 'hoy' : i === 1 ? 'ayer' : `hace ${i} días`}. Usa la versión fácil o sáltate ese ejercicio. Si el dolor es fuerte o no mejora, consulta a un profesional.`,
        });
      }
    }
  }

  // Ayer entrenamiento registrado y hoy también toca.
  const ayer = addDays(hoy, -1);
  const planAyer = dayPlan(ayer, ajustes);
  if (plan.tipo === 'entreno' && planAyer.tipo === 'entreno' && dayStatus(planAyer, registros[ayer], hoy).hechas > 0) {
    lista.push({ tono: 'info', texto: 'Ayer también entrenaste. Si tienes agujetas fuertes, haz una serie menos o la versión fácil.' });
  }

  // Varios días de entrenamiento sin registro en la última semana.
  let perdidos = 0;
  for (let i = 1; i <= 7; i += 1) {
    const fecha = addDays(hoy, -i);
    const p = dayPlan(fecha, ajustes);
    if (p.antesDeInicio || p.tipo !== 'entreno') continue;
    if (dayStatus(p, registros[fecha], hoy).estado === 'sin-registro') perdidos += 1;
  }
  if (perdidos >= 2) {
    lista.push({ tono: 'info', texto: `Hay ${perdidos} sesiones de entrenamiento sin registrar en los últimos 7 días. Retoma con la carga de siempre; no intentes recuperar lo perdido de golpe.` });
  }

  return lista;
}

// ---- js/logic/progresion.js ----
// Reglas de progresión. Transparentes, locales y sin inteligencia artificial externa.
// Nunca cambian el plan por sí solas: solo generan PROPUESTAS que el usuario acepta o no.
// Los números de las reglas se pueden cambiar desde Ajustes (ajustes.reglas).


const REGLAS_PREDETERMINADAS = {
  sesionesParaProgresar: 2, // sesiones seguidas cumpliendo el objetivo antes de subir
  pasoReps: 2, // cuánto sube o baja el rango de repeticiones
  pasoSegundos: 5, // cuánto sube o baja el rango de segundos
  topeReps: 15, // al llegar aquí, se propone una variante más difícil
  topeSegundos: 60,
  adherenciaMinima: 0.5, // fracción de obligatorias hechas en la semana para permitir subir
};

const LIMITES_REGLAS = {
  sesionesParaProgresar: [1, 6],
  pasoReps: [1, 5],
  pasoSegundos: [5, 20],
  topeReps: [8, 30],
  topeSegundos: [20, 180],
  adherenciaMinima: [0, 1],
};

function reglasDe(ajustes) {
  return { ...REGLAS_PREDETERMINADAS, ...((ajustes && ajustes.reglas) || {}) };
}

function textoReglas(r) {
  return [
    { titulo: 'El dolor va primero', texto: 'Si registras molestias moderadas o fuertes en un ejercicio, nunca se propone subir. Se propone revisarlo: versión fácil o pausa, y consultar a un profesional si persiste.' },
    { titulo: 'Primero la técnica', texto: 'Si la última sesión tuvo técnica regular o mala, se mantiene. Si fue mala dos veces seguidas, o fue muy difícil sin llegar al mínimo, se propone bajar.' },
    { titulo: 'Cuándo subir', texto: `Hacen falta ${r.sesionesParaProgresar} ${r.sesionesParaProgresar === 1 ? 'sesión' : 'sesiones'} seguidas, desde el último cambio, con todas las series en el máximo del rango, técnica buena, dificultad fácil o moderada y sin molestias.` },
    { titulo: 'Cuánto subir', texto: `+${r.pasoReps} repeticiones o +${r.pasoSegundos} segundos. Al llegar a ${r.topeReps} repeticiones o ${r.topeSegundos} segundos se propone pasar a la variante más difícil de la ficha y volver al rango inicial.` },
    { titulo: 'Freno de la semana', texto: `No se sube nada si hiciste menos del ${Math.round(r.adherenciaMinima * 100)} % de las actividades obligatorias, o si dormiste mal, te recuperaste mal o tuviste la energía baja.` },
    { titulo: 'Lo que no sube solo', texto: 'Suelo pélvico, respiración, movilidad y cardio no aumentan automáticamente. En el suelo pélvico se busca control y relajación, no más volumen.' },
    { titulo: 'Tú decides', texto: 'Nada se aplica sin tu aceptación, y cualquier cambio aceptado se puede deshacer en Ajustes.' },
  ];
}

const PROGRESABLES = new Set(['fuerza', 'habilidad', 'core']);
const CON_MOLESTIA = new Set(['moderada', 'fuerte']);

// Primera aparición de cada ejercicio con series en el plan semanal (su prescripción base).
function actividadBase(ejercicioId) {
  for (const dia of PLAN_SEMANAL) {
    const a = dia.actividades.find((x) => x.ejercicio === ejercicioId && x.series);
    if (a) return a;
  }
  return null;
}

function ejerciciosProgresables() {
  const ids = [];
  for (const dia of PLAN_SEMANAL) {
    for (const a of dia.actividades) {
      const ej = getEjercicio(a.ejercicio);
      if (!a.series || !ej || !PROGRESABLES.has(ej.categoria) || ids.includes(a.ejercicio)) continue;
      if (parseRango(a.reps || a.segundos)) ids.push(a.ejercicio);
    }
  }
  return ids;
}

// Sesiones registradas (hechas u omitidas) de un ejercicio, de la más reciente a la más antigua.
function sesionesDe(ejercicioId, registros, ajustes, hasta, desde = null) {
  const fechas = Object.keys(registros).filter((f) => isValidISO(f) && f <= hasta && (!desde || f >= desde)).sort().reverse();
  const lista = [];
  for (const fecha of fechas) {
    const plan = dayPlan(fecha, ajustes);
    for (const a of plan.actividades) {
      if (a.ejercicio !== ejercicioId) continue;
      const entrada = registros[fecha].actividades?.[a.id];
      if (entrada) lista.push({ fecha, actividad: a, entrada });
    }
  }
  return lista;
}

function cumpleObjetivo(s) {
  const rango = parseRango(s.actividad.reps || s.actividad.segundos);
  const series = (s.entrada.series || []).filter((v) => v !== null && v !== undefined);
  if (!rango || series.length < s.actividad.series) return { ok: false, motivo: 'no completaste todas las series' };
  if (series.some((v) => v < rango.max)) return { ok: false, motivo: `aún no llegas al máximo del rango (${formatoRango(rango)}) en todas las series` };
  if (s.entrada.tecnica !== 'buena') return { ok: false, motivo: 'la técnica no se registró como buena' };
  if (!['facil', 'moderada'].includes(s.entrada.dificultad)) return { ok: false, motivo: s.entrada.dificultad ? 'la dificultad fue alta' : 'falta anotar la dificultad' };
  if (CON_MOLESTIA.has(s.entrada.molestias)) return { ok: false, motivo: 'hubo molestias' };
  return { ok: true };
}

function mover(rango, paso, minimo) {
  const min = Math.max(minimo, rango.min + paso);
  return { min, max: Math.max(min, rango.max + paso) };
}

// Evalúa un ejercicio y devuelve una propuesta con su motivo explicado.
function evaluarEjercicio(ejercicioId, { registros, ajustes, hasta, reglas = reglasDe(ajustes), contexto = {} }) {
  const ej = getEjercicio(ejercicioId);
  const base = actividadBase(ejercicioId);
  const tipo = base && base.reps ? 'reps' : 'segundos';
  const rangoBase = base ? parseRango(base[tipo]) : null;
  const vigente = cambioVigente(ajustes, ejercicioId, hasta);
  const rangoActual = vigente && vigente[tipo] ? parseRango(vigente[tipo]) : rangoBase;
  const resultado = {
    ejercicio: ejercicioId,
    nombre: ej ? ej.nombre : ejercicioId,
    tipo,
    actual: rangoActual ? formatoRango(rangoActual) : null,
    propuesto: null,
    accion: 'mantener',
    motivo: '',
    consejo: null,
  };

  const todas = sesionesDe(ejercicioId, registros, ajustes, hasta).filter((s) => s.entrada.estado === 'hecho');
  const recientes = todas.slice(0, 2);

  // Regla 1: dolor
  const conDolor = recientes.find((s) => CON_MOLESTIA.has(s.entrada.molestias));
  if (conDolor) {
    return { ...resultado, accion: 'revisar', motivo: `Registraste molestias ${conDolor.entrada.molestias}s el ${formatShort(conDolor.fecha)}. No se sube la dificultad.`, consejo: 'Usa la versión más fácil de la ficha o descansa este ejercicio. Si el dolor persiste o empeora, consulta a un profesional.' };
  }

  if (!ej || !PROGRESABLES.has(ej.categoria) || !rangoActual) {
    return { ...resultado, motivo: ej && ej.categoria === 'suelo-pelvico' ? 'El suelo pélvico no aumenta automáticamente: se busca control y relajación, no más volumen.' : 'Este ejercicio no progresa automáticamente.' };
  }

  if (!todas.length) return { ...resultado, motivo: 'Todavía no hay sesiones registradas de este ejercicio.' };

  // Regla 2: técnica y dificultad excesiva
  const [ultima, penultima] = todas;
  const pasoBajada = tipo === 'reps' ? -reglas.pasoReps : -reglas.pasoSegundos;
  const minimo = tipo === 'reps' ? 3 : 5;
  const debajoDelMinimo = (s) => {
    const r = parseRango(s.actividad[tipo]);
    const v = (s.entrada.series || []).filter((x) => x !== null && x !== undefined);
    return r && v.length > 0 && v.every((x) => x < r.min);
  };
  const malaDosVeces = penultima && ultima.entrada.tecnica === 'mala' && penultima.entrada.tecnica === 'mala';
  const muyDuroDosVeces = penultima && [ultima, penultima].every((s) => s.entrada.dificultad === 'muy-dificil' && debajoDelMinimo(s));
  if (malaDosVeces || muyDuroDosVeces) {
    const nuevo = mover(rangoActual, pasoBajada, minimo);
    if (nuevo.min === rangoActual.min && nuevo.max === rangoActual.max) {
      return { ...resultado, accion: 'revisar', motivo: malaDosVeces ? 'La técnica fue mala dos veces seguidas y el rango ya está en el mínimo.' : 'Fue muy difícil dos veces seguidas y el rango ya está en el mínimo.', consejo: 'Cambia a la versión más fácil de la ficha.' };
    }
    return { ...resultado, accion: 'reducir', propuesto: formatoRango(nuevo), motivo: malaDosVeces ? 'La técnica fue mala dos veces seguidas.' : 'Fue muy difícil dos veces seguidas sin llegar al mínimo del rango.', consejo: 'Bajar un poco permite entrenar con buena técnica. También puedes usar la versión fácil de la ficha.' };
  }
  if (['regular', 'mala'].includes(ultima.entrada.tecnica)) {
    return { ...resultado, motivo: `En la última sesión la técnica fue ${ultima.entrada.tecnica}. Primero hay que afianzarla.` };
  }

  // Regla 3: progresar (solo con sesiones posteriores al último cambio)
  const desde = vigente ? vigente.desde : null;
  const validas = todas.filter((s) => !desde || s.fecha >= desde);
  const necesarias = reglas.sesionesParaProgresar;
  if (validas.length < necesarias) {
    return { ...resultado, motivo: `Hacen falta ${necesarias} sesiones registradas ${desde ? 'desde el último cambio ' : ''}para valorar una subida (llevas ${validas.length}).` };
  }
  for (const s of validas.slice(0, necesarias)) {
    const c = cumpleObjetivo(s);
    if (!c.ok) return { ...resultado, motivo: `El ${formatShort(s.fecha)} ${c.motivo}.` };
  }

  let propuesta;
  const tope = tipo === 'reps' ? reglas.topeReps : reglas.topeSegundos;
  const paso = tipo === 'reps' ? reglas.pasoReps : reglas.pasoSegundos;
  if (rangoActual.max + paso > tope) {
    const variante = ej.progresion && ej.progresion[0];
    propuesta = {
      ...resultado,
      accion: 'variante',
      propuesto: formatoRango(rangoBase),
      motivo: `Llegaste al tope (${tope}${tipo === 'reps' ? ' repeticiones' : ' s'}) con buena técnica en ${necesarias} sesiones seguidas.`,
      consejo: variante ? `Pasa a la versión más difícil: «${variante}». Al aceptar, el objetivo vuelve al rango inicial (${formatoRango(rangoBase)}).` : 'Pasa a una versión más difícil y vuelve al rango inicial.',
    };
  } else {
    propuesta = {
      ...resultado,
      accion: 'progresar',
      propuesto: formatoRango(mover(rangoActual, paso, minimo)),
      motivo: `Completaste el máximo del rango con buena técnica, esfuerzo controlado y sin molestias en ${necesarias} ${necesarias === 1 ? 'sesión' : 'sesiones seguidas'}.`,
      consejo: 'Subida pequeña. Si la técnica empeora con el nuevo objetivo, la regla de técnica lo frenará.',
    };
  }

  // Regla 5: freno general de la semana
  const frenos = [];
  if (contexto.adherencia !== undefined && contexto.adherencia < reglas.adherenciaMinima) frenos.push(`hiciste solo el ${Math.round(contexto.adherencia * 100)} % de las actividades obligatorias`);
  if (contexto.recuperacion === 'mal') frenos.push('te recuperaste mal');
  if (contexto.sueno === 'mal') frenos.push('dormiste mal');
  if (contexto.energia === 'baja') frenos.push('tuviste la energía baja');
  if (frenos.length) {
    return { ...resultado, motivo: `Cumplías para subir, pero esta semana ${frenos.join(', ')}. Se mantiene para no forzar.` };
  }
  return propuesta;
}

const ACCIONES_APLICABLES = new Set(['progresar', 'variante', 'reducir']);

// Resumen de una semana (lunes a domingo) para la evaluación.
function resumenSemana(lunes, registros, ajustes, hoy) {
  const semana = weekProgress(lunes, ajustes, registros, hoy);
  const noHechas = [];
  const conDolor = [];
  const porEjercicio = new Map();
  for (const d of semana.dias) {
    if (d.plan.antesDeInicio) continue;
    for (const a of d.plan.actividades) {
      const e = registros[d.fecha]?.actividades?.[a.id];
      if (a.obligatoria && (!e || e.estado !== 'hecho') && d.fecha <= hoy) noHechas.push({ fecha: d.fecha, nombre: a.datos?.nombre || a.ejercicio, estado: e ? 'omitida' : 'sin registro' });
      if (!e || e.estado !== 'hecho') continue;
      if (CON_MOLESTIA.has(e.molestias)) conDolor.push({ fecha: d.fecha, nombre: a.datos?.nombre });
      if (!a.series) continue;
      const item = porEjercicio.get(a.ejercicio) || { ejercicio: a.ejercicio, nombre: a.datos?.nombre, unidad: a.segundos ? 's' : 'rep.', sesiones: 0, mejor: null, dificultades: [], tecnicas: [] };
      item.sesiones += 1;
      for (const v of e.series || []) if (v !== null && v !== undefined) item.mejor = Math.max(item.mejor ?? 0, v);
      if (e.dificultad) item.dificultades.push(e.dificultad);
      if (e.tecnica) item.tecnicas.push(e.tecnica);
      porEjercicio.set(a.ejercicio, item);
    }
  }
  return {
    lunes,
    obligatorias: semana.obligatorias,
    hechas: semana.hechas,
    adherencia: semana.obligatorias ? semana.hechas / semana.obligatorias : 0,
    noHechas,
    conDolor,
    porEjercicio: [...porEjercicio.values()],
  };
}

// Propuestas para la semana siguiente. Incluye "revisar" para cualquier ejercicio con molestias.
function propuestasSemana({ lunes, registros, ajustes, contexto, hoy }) {
  const hasta = addDays(lunes, 6) < hoy ? addDays(lunes, 6) : hoy;
  const reglas = reglasDe(ajustes);
  const lista = ejerciciosProgresables().map((id) => evaluarEjercicio(id, { registros, ajustes, hasta, reglas, contexto }));
  const resumen = resumenSemana(lunes, registros, ajustes, hoy);
  for (const d of resumen.conDolor) {
    const ej = Object.values(PLAN_SEMANAL).flatMap((x) => x.actividades).find((a) => getEjercicio(a.ejercicio)?.nombre === d.nombre);
    if (ej && !lista.some((p) => p.ejercicio === ej.ejercicio)) {
      lista.push({ ejercicio: ej.ejercicio, nombre: d.nombre, accion: 'revisar', actual: null, propuesto: null, motivo: `Registraste molestias el ${formatShort(d.fecha)}.`, consejo: 'Detén o modifica la práctica. Si las molestias persisten, consulta a un profesional.' });
    }
  }
  return lista;
}

// Fecha desde la que se aplican los cambios aceptados: el lunes siguiente a la semana evaluada,
// o hoy si la evaluación se hace tarde.
function fechaAplicacion(lunes, hoy) {
  const siguiente = addDays(mondayOf(lunes), 7);
  return siguiente > hoy ? siguiente : hoy;
}

function aplicarPropuestas(ajustes, propuestas, desde, ahora = new Date().toISOString()) {
  const nuevos = propuestas.filter((p) => ACCIONES_APLICABLES.has(p.accion) && p.propuesto).map((p, i) => ({
    id: `${ahora}-${i}`,
    ejercicio: p.ejercicio,
    desde,
    [p.tipo]: p.propuesto,
    anterior: p.actual,
    accion: p.accion,
    motivo: p.accion === 'variante' ? `${p.motivo} ${p.consejo}` : p.motivo,
  }));
  return { ...ajustes, cambiosPlan: [...((ajustes && ajustes.cambiosPlan) || []), ...nuevos] };
}

// ---- js/ui/evaluacion.js ----
// Evaluación semanal: resumen automático de la semana, unas pocas preguntas
// y propuestas de ajuste que el usuario acepta una a una. Nada se aplica sin aceptar.


const borradores = new Map();

const PREGUNTAS = [
  { clave: 'recuperacion', leyenda: '¿Recuperaste bien entre sesiones?', valores: [['bien', 'Bien'], ['regular', 'Regular'], ['mal', 'Mal']] },
  { clave: 'sueno', leyenda: '¿Cómo dormiste esta semana?', valores: [['bien', 'Bien'], ['regular', 'Regular'], ['mal', 'Mal']] },
  { clave: 'energia', leyenda: '¿Cómo estuvo tu energía?', valores: [['alta', 'Alta'], ['normal', 'Normal'], ['baja', 'Baja']] },
  { clave: 'coordinacion', leyenda: '¿Notas avances en control y coordinación del suelo pélvico?', valores: [['si', 'Sí'], ['algo', 'Algo'], ['no', 'No']] },
  { clave: 'molestias', leyenda: '¿Tienes molestias o dolor que se repiten?', valores: [['no', 'No'], ['si', 'Sí']] },
];

const NOMBRE_ACCION = {
  progresar: ['Subir', 'ok'],
  variante: ['Variante más difícil', 'ok'],
  reducir: ['Bajar', 'aviso'],
  revisar: ['Revisar', 'alerta'],
  mantener: ['Mantener', 'neutro'],
};
const TEXTO_DIF = { facil: 'fácil', moderada: 'moderada', dificil: 'difícil', 'muy-dificil': 'muy difícil' };

// Semana que conviene evaluar hoy (o null): la actual el domingo; la anterior el lunes o el martes.
function semanaPorEvaluar(hoy, ajustes, evaluaciones) {
  if (!ajustes.inicio) return null;
  const dia = (parseISO(hoy).getDay() + 6) % 7;
  let lunes = null;
  if (dia === 6) lunes = mondayOf(hoy);
  else if (dia <= 1) lunes = addDays(mondayOf(hoy), -7);
  if (!lunes || addDays(lunes, 6) < ajustes.inicio || evaluaciones[lunes]) return null;
  return lunes;
}

function rangoSemana(lunes) {
  const domingo = addDays(lunes, 6);
  return `${formatShort(lunes)} – ${formatShort(domingo)}`;
}

function vistaEvaluacion(ctx, lunesParam) {
  const { hoy, ajustes, registros, evaluaciones } = ctx;
  const lunes = lunesParam && isValidISO(lunesParam) ? mondayOf(lunesParam) : mondayOf(hoy);
  const numero = programWeek(ajustes.inicio, lunes);
  const fase = phaseFor(numero);
  const guardada = evaluaciones[lunes];
  const domingo = addDays(lunes, 6);

  const raiz = h('div', { class: 'pila' },
    h('header', { class: 'encabezado' },
      h('a', { class: 'volver', href: '#/historial' }, icono('izquierda'), 'Historial'),
      h('p', { class: 'sobretitulo' }, numero ? `Semana ${numero} · ${fase.nombre}` : 'Fuera del programa'),
      h('h1', {}, 'Evaluación semanal'),
      h('p', { class: 'apagado' }, rangoSemana(lunes))));

  if (!numero) {
    raiz.append(h('p', { class: 'aviso aviso-info' }, icono('info'), h('span', {}, 'Esta semana es anterior al inicio de tu programa.')));
    return raiz;
  }
  if (domingo > hoy && !guardada) {
    raiz.append(h('p', { class: 'aviso aviso-info' }, icono('info'), h('span', {}, `La evaluación de esta semana se abre el domingo ${formatShort(domingo)}, cuando ya tengas los datos de toda la semana.`)));
    raiz.append(tarjetaResumen(resumenSemana(lunes, registros, ajustes, hoy)));
    return raiz;
  }

  const resumen = resumenSemana(lunes, registros, ajustes, hoy);
  if (guardada) {
    raiz.append(vistaGuardada(guardada), tarjetaResumen(resumen));
    return raiz;
  }

  if (!borradores.has(lunes)) borradores.set(lunes, { respuestas: {}, paso: 'preguntas', aceptadas: new Set(), notas: '' });
  const b = borradores.get(lunes);
  raiz.append(tarjetaResumen(resumen));
  if (b.paso === 'preguntas') raiz.append(formPreguntas(ctx, b));
  else raiz.append(listaPropuestas(ctx, lunes, b, resumen));
  return raiz;
}

function tarjetaResumen(r) {
  const pct = Math.round(r.adherencia * 100);
  return h('section', { class: 'tarjeta' },
    h('h2', { class: 'h3' }, 'Tu semana en datos'),
    h('div', { class: 'fila-entre' }, h('span', {}, 'Actividades obligatorias hechas'), h('strong', { class: 'num' }, `${r.hechas} de ${r.obligatorias} (${pct} %)`)),
    r.porEjercicio.length
      ? h('ul', { class: 'lista-secciones' }, r.porEjercicio.map((e) => h('li', {},
        h('span', {}, e.nombre),
        h('span', { class: 'apagado num' }, [
          `mejor ${e.mejor ?? '—'} ${e.unidad}`,
          e.dificultades.length ? TEXTO_DIF[e.dificultades[e.dificultades.length - 1]] : null,
        ].filter(Boolean).join(' · ')))))
      : h('p', { class: 'apagado' }, 'No hay ejercicios con series registrados esta semana.'),
    r.conDolor.length ? h('p', { class: 'aviso aviso-alerta' }, icono('alerta'), h('span', {}, `Molestias registradas en: ${[...new Set(r.conDolor.map((d) => d.nombre))].join(', ')}.`)) : null,
    r.noHechas.length ? h('details', { class: 'detalles' },
      h('summary', {}, `${r.noHechas.length} obligatorias sin hacer`),
      h('ul', { class: 'vinetas' }, r.noHechas.map((n) => h('li', {}, `${capitalize(formatShort(n.fecha))}: ${n.nombre} (${n.estado})`)))) : null);
}

function formPreguntas(ctx, b) {
  const error = h('p', { class: 'error', role: 'alert', hidden: true });
  const form = h('form', { class: 'formulario tarjeta', novalidate: true },
    h('h2', { class: 'h3' }, 'Cinco preguntas rápidas'),
    PREGUNTAS.map((p) => opciones({ nombre: `ev-${p.clave}`, leyenda: p.leyenda, valores: p.valores, actual: b.respuestas[p.clave] ?? null, alCambiar: (v) => { b.respuestas[p.clave] = v; } })),
    h('div', { class: 'campo' }, h('label', { for: 'ev-notas' }, 'Notas de la semana (opcional)'),
      h('textarea', { id: 'ev-notas', rows: '2', maxlength: '1000', placeholder: 'Ej.: la muñeca derecha molesta en la pica', oninput: (e) => { b.notas = e.target.value; } }, b.notas)),
    error,
    h('button', { class: 'boton boton-principal boton-ancho', type: 'submit' }, 'Ver propuestas'));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const faltan = ['recuperacion', 'sueno', 'energia'].filter((k) => !b.respuestas[k]);
    if (faltan.length) {
      error.textContent = 'Responde al menos recuperación, sueño y energía: sirven para no subir la dificultad en una mala semana.';
      error.hidden = false;
      return;
    }
    b.paso = 'propuestas';
    ctx.redibujar();
  });
  return form;
}

function tarjetaPropuesta(p, b) {
  const [nombreAccion, tono] = NOMBRE_ACCION[p.accion];
  const aplicable = ACCIONES_APLICABLES.has(p.accion);
  const id = `prop-${p.ejercicio}`;
  return h('li', { class: `tarjeta propuesta accion-${p.accion}` },
    h('div', { class: 'fila-entre' }, h('strong', {}, p.nombre), etiqueta(nombreAccion, tono)),
    p.actual ? h('p', { class: 'num cambio' }, aplicable ? [`${p.actual}`, h('span', { class: 'flecha', 'aria-hidden': 'true' }, ' → '), h('strong', {}, p.propuesto), h('span', { class: 'sr' }, ` (de ${p.actual} a ${p.propuesto})`)] : `Objetivo actual: ${p.actual}`, ` ${p.tipo === 'reps' ? 'rep.' : 's'}`) : null,
    h('p', { class: 'apagado' }, p.motivo),
    p.consejo ? h('p', {}, p.consejo) : null,

}

function listaPropuestas(ctx, lunes, b, resumen) {
  const contexto = { ...b.respuestas, adherencia: resumen.adherencia };
  const todas = propuestasSemana({ lunes, registros: ctx.registros, ajustes: ctx.ajustes, contexto, hoy: ctx.hoy });
  const aplicables = todas.filter((p) => ACCIONES_APLICABLES.has(p.accion));
  const revisar = todas.filter((p) => p.accion === 'revisar');
  const mantener = todas.filter((p) => p.accion === 'mantener');
  const desde = fechaAplicacion(lunes, ctx.hoy);

  const guardar = async () => {
    const aceptadas = aplicables.filter((p) => b.aceptadas.has(p.ejercicio));
    try {
      if (aceptadas.length) await ctx.guardarAjustes(aplicarPropuestas(ctx.ajustes, aceptadas, desde));
      await ctx.guardarEvaluacion({
        semana: lunes,
        respuestas: { ...b.respuestas, notas: b.notas.trim() },
        resumen: { hechas: resumen.hechas, obligatorias: resumen.obligatorias },
        propuestas: todas.map((p) => ({ ejercicio: p.ejercicio, nombre: p.nombre, accion: p.accion, actual: p.actual, propuesto: p.propuesto, motivo: p.motivo })),
        aceptadas: aceptadas.map((p) => p.ejercicio),
        desde: aceptadas.length ? desde : null,
      });
      borradores.delete(lunes);
      avisar(aceptadas.length ? `Evaluación guardada. ${aceptadas.length} ${aceptadas.length === 1 ? 'ajuste aplicado' : 'ajustes aplicados'} desde el ${formatShort(desde)}.` : 'Evaluación guardada sin cambios en el plan.');
    } catch (error) {
      console.error(error);
      avisar('No se pudo guardar la evaluación. Inténtalo de nuevo.', 'alerta');
    }

  return h('div', { class: 'pila' },
    revisar.length ? h('section', { class: 'seccion' },
      h('h2', { class: 'titulo-seccion' }, 'Para revisar'),
      h('ul', { class: 'lista-dias' }, revisar.map((p) => tarjetaPropuesta(p, b)))) : null,
    h('section', { class: 'seccion' },
      h('h2', { class: 'titulo-seccion' }, 'Ajustes propuestos'),
      aplicables.length
        ? [h('p', { class: 'apagado' }, `Marca los que quieras aplicar. Se aplicarán desde el ${formatLong(desde)}. Podrás deshacerlos en Ajustes.`),
          h('ul', { class: 'lista-dias' }, aplicables.map((p) => tarjetaPropuesta(p, b)))]
        : h('p', { class: 'tarjeta' }, 'Esta semana no hay cambios propuestos. Mantener también es progresar: la técnica y la constancia se consolidan.')),
    mantener.length ? h('details', { class: 'detalles' },
      h('summary', {}, `Se mantienen (${mantener.length}) y por qué`),
      h('ul', { class: 'lista-dias' }, mantener.map((p) => tarjetaPropuesta(p, b)))) : null,
    h('div', { class: 'acciones' },
      h('button', { class: 'boton boton-principal', type: 'button', onclick: guardar }, icono('check'), 'Guardar evaluación'),
      h('button', { class: 'boton boton-secundario', type: 'button', onclick: () => { b.paso = 'preguntas'; ctx.redibujar(); } }, 'Cambiar respuestas')));
}

// ---- js/ui/progreso.js ----
// Evolución por ejercicio (gráfico simple + tabla) y pantalla de reglas de progresión.


const TEXTO_TECNICA = { buena: 'buena', regular: 'regular', mala: 'mala' };
const TEXTO_DIFICULTAD = { facil: 'fácil', moderada: 'moderada', dificil: 'difícil', 'muy-dificil': 'muy difícil' };

// Puntos de un ejercicio: la mejor serie de cada sesión hecha, de la más antigua a la más reciente.
function puntosEvolucion(ejercicioId, registros, ajustes, hoy) {
  return sesionesDe(ejercicioId, registros, ajustes, hoy)
    .filter((s) => s.entrada.estado === 'hecho')
    .map((s) => {
      const valores = (s.entrada.series || []).filter((v) => v !== null && v !== undefined);
      return {
        fecha: s.fecha,
        mejor: valores.length ? Math.max(...valores) : null,
        total: valores.reduce((t, v) => t + v, 0),
        objetivo: s.actividad.reps || s.actividad.segundos,
        tecnica: s.entrada.tecnica,
        dificultad: s.entrada.dificultad,
        molestias: s.entrada.molestias,
      };
    })
    .filter((p) => p.mejor !== null)
    .reverse();
}

function grafico(puntos, unidad) {
  const ancho = 340;
  const alto = 180;
  const m = { izq: 34, der: 14, arr: 16, aba: 28 };
  const maxV = Math.max(...puntos.map((p) => p.mejor));
  const techo = Math.max(4, Math.ceil((maxV * 1.15) / 4) * 4); // múltiplo de 4: marcas enteras
  const x = (i) => m.izq + (puntos.length === 1 ? (ancho - m.izq - m.der) / 2 : (i * (ancho - m.izq - m.der)) / (puntos.length - 1));
  const y = (v) => alto - m.aba - (v / techo) * (alto - m.arr - m.aba);
  const ticks = [0, techo / 2, techo];
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, texto) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (texto !== undefined) n.textContent = texto;
    return n;
  };
  const svg = el('svg', { viewBox: `0 0 ${ancho} ${alto}`, class: 'grafico', role: 'img', 'aria-label': `Mejor serie por sesión, de ${puntos[0].mejor} a ${puntos[puntos.length - 1].mejor} ${unidad}` });
  for (const t of ticks) {
    svg.append(el('line', { x1: m.izq, x2: ancho - m.der, y1: y(t), y2: y(t), class: 'g-rejilla' }));
    svg.append(el('text', { x: m.izq - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'g-eje' }, String(t)));
  }
  svg.append(el('text', { x: m.izq, y: alto - 8, class: 'g-eje' }, formatShort(puntos[0].fecha)));
  if (puntos.length > 1) svg.append(el('text', { x: ancho - m.der, y: alto - 8, 'text-anchor': 'end', class: 'g-eje' }, formatShort(puntos[puntos.length - 1].fecha)));
  if (puntos.length > 1) {
    svg.append(el('polyline', { points: puntos.map((p, i) => `${x(i)},${y(p.mejor)}`).join(' '), class: 'g-linea' }));
  }
  const info = h('p', { class: 'g-info', 'aria-live': 'polite' }, 'Toca un punto para ver el detalle.');
  puntos.forEach((p, i) => {
    const dolor = p.molestias === 'moderada' || p.molestias === 'fuerte';
    const g = el('g', { class: 'g-punto', tabindex: '0', role: 'button', 'aria-label': `${formatShort(p.fecha)}: ${p.mejor} ${unidad}` });
    g.append(el('circle', { cx: x(i), cy: y(p.mejor), r: 14, class: 'g-zona' }));
    g.append(el('circle', { cx: x(i), cy: y(p.mejor), r: 5, class: dolor ? 'g-marca g-dolor' : p.tecnica === 'buena' ? 'g-marca' : 'g-marca g-hueca' }));
    const mostrar = () => {
      info.textContent = `${capitalize(formatShort(p.fecha))}: mejor serie ${p.mejor} ${unidad} (objetivo ${p.objetivo}) · técnica ${TEXTO_TECNICA[p.tecnica] || 'sin anotar'} · dificultad ${TEXTO_DIFICULTAD[p.dificultad] || 'sin anotar'}${dolor ? ` · molestias ${p.molestias}` : ''}`;
      svg.querySelectorAll('.g-marca').forEach((c) => c.classList.remove('g-activa'));
      g.querySelector('.g-marca').classList.add('g-activa');
    };
    g.addEventListener('click', mostrar);
    g.addEventListener('mouseenter', mostrar);
    g.addEventListener('focus', mostrar);
    svg.append(g);
  });
  const caja = h('figure', { class: 'figura-grafico' });
  caja.append(svg, info,
    h('figcaption', { class: 'leyenda' },
      h('span', { class: 'ley' }, h('span', { class: 'ley-punto' }), 'técnica buena'),
      h('span', { class: 'ley' }, h('span', { class: 'ley-punto hueca' }), 'técnica regular o sin anotar'),
      h('span', { class: 'ley' }, h('span', { class: 'ley-punto dolor' }), 'con molestias')));
  return caja;
}

        h('tbody', {}, [...elegido.puntos].reverse().map((p) => h('tr', {},

          h('td', {}, TEXTO_TECNICA[p.tecnica] || '—'), h('td', {}, p.molestias || '—'))))))));
  }
  raiz.append(seccion);
  return raiz;
}

function vistaReglas(ctx) {

  raiz.append(h('section', { class: 'tarjeta', 'aria-labelledby': 'titulo-semana' },
    h('div', { class: 'fila-entre' },
      h('h2', { id: 'titulo-semana', class: 'h3' }, 'Esta semana'),
      h('a', { class: 'enlace', href: `#/semana/${lunes}` }, 'Ver semana', icono('derecha'))),
    h('ol', { class: 'tira-semana' }, semana.dias.map((d) =>
      h('li', {},
        h('a', { href: `#/dia/${d.fecha}`, class: `punto-dia estado-${d.estado.estado} ${d.fecha === hoy ? 'es-hoy' : ''}`, 'aria-label': `${capitalize(formatLong(d.fecha))}: ${ESTADOS_DIA[d.estado.estado]}` },
          h('span', { class: 'letra' }, DIAS_CORTOS[weekdayIndex(d.fecha)]),
          h('span', { class: 'marca' }, d.estado.estado === 'completo' ? icono('check') : d.estado.estado === 'parcial' ? icono('menos') : null))))),
    h('p', { class: 'apagado' }, `${semana.hechas} de ${semana.obligatorias} actividades obligatorias registradas como hechas.`)));

  // Próximo objetivo
  if (plan.fase) {
    raiz.append(h('section', { class: 'tarjeta', 'aria-labelledby': 'titulo-objetivo' },
      h('h2', { id: 'titulo-objetivo', class: 'h3 con-icono' }, icono('diana'), 'Próximo objetivo'),
      h('p', {}, plan.fase.objetivo),
      h('p', { class: 'apagado' }, plan.fase.meta),
      h('p', { class: 'pie' }, `Fase ${plan.fase.nombre.toLowerCase()}: semana ${plan.fase.semanaEnFase} de ${plan.fase.semanas}. Los objetivos se ajustarán a tus registros más adelante.`)));
  }

  // Última sesión
  raiz.append(h('section', { class: 'tarjeta', 'aria-labelledby': 'titulo-ultima' },
    h('div', { class: 'fila-entre' },
      h('h2', { id: 'titulo-ultima', class: 'h3' }, 'Última sesión'),
      h('a', { class: 'enlace', href: '#/historial' }, 'Historial', icono('derecha'))),
    ultima ? resumenUltima(ultima) : h('p', { class: 'apagado' }, 'Todavía no hay sesiones registradas. Aparecerán aquí cuando marques actividades como hechas.')));

  return raiz;
}

function resumenUltima(u) {
  return h('a', { class: 'resumen-sesion', href: `#/dia/${u.fecha}` },
    h('div', {},
      h('strong', {}, `${capitalize(formatShort(u.fecha))} · ${u.plan.titulo}`),
      h('p', { class: 'apagado' }, `${u.hechas.length} hechas${u.omitidas.length ? ` · ${u.omitidas.length} omitidas` : ''}${u.molestias.length ? ` · molestias en ${u.molestias.length}` : ''}`)),
    icono('derecha'));
}

function bienvenida(ctx) {
  const { hoy } = ctx;
  const proximoLunes = weekdayIndex(hoy) === 0 ? hoy : addDays(mondayOf(hoy), 7);
  let elegida = hoy;
  const error = h('p', { class: 'error', role: 'alert', hidden: true });
  const campo = h('input', { type: 'date', id: 'fecha-inicio', value: hoy, onchange: (e) => { elegida = e.target.value; } });

  const empezar = async (fecha) => {
    if (!fecha) { error.textContent = 'Elige una fecha válida.'; error.hidden = false; return; }
    await ctx.guardarAjustes({ ...ctx.ajustes, inicio: fecha });
  };

  return h('div', { class: 'pila' },
    h('header', { class: 'encabezado' },
      h('p', { class: 'sobretitulo' }, 'Bienvenido'),
      h('h1', {}, 'Tu sistema personal'),
      h('p', { class: 'apagado' }, 'Aquí verás cada día todo lo que toca: calistenia, suelo pélvico, movilidad, respiración y descanso, con la explicación de cada ejercicio. Tus registros se guardan solo en este dispositivo.')),
    h('section', { class: 'tarjeta', 'aria-labelledby': 'titulo-inicio' },
      h('h2', { id: 'titulo-inicio', class: 'h3' }, '¿Cuándo empiezas el programa?'),
      h('p', { class: 'apagado' }, 'La semana 1 empieza el lunes de la semana que elijas. Podrás cambiar la fecha en Ajustes.'),
      h('div', { class: 'pila-corta' },
        h('button', { class: 'boton boton-principal boton-ancho', type: 'button', onclick: () => empezar(hoy) }, `Empezar hoy (${formatShort(hoy)})`),
        proximoLunes !== hoy ? h('button', { class: 'boton boton-secundario boton-ancho', type: 'button', onclick: () => empezar(proximoLunes) }, `Empezar el lunes ${formatShort(proximoLunes)}`) : null,
        h('div', { class: 'campo' }, h('label', { for: 'fecha-inicio' }, 'U otra fecha'), campo),
        h('button', { class: 'boton boton-secundario boton-ancho', type: 'button', onclick: () => empezar(elegida) }, 'Empezar en la fecha elegida'),
        error)));
}

// ---- js/ui/week.js ----
// Calendario semanal: los 7 días con lo previsto y lo registrado.


const TONO_ESTADO = {
  completo: 'ok',
  parcial: 'aviso',
  'sin-registro': 'apagado',
  pendiente: 'acento',
  futuro: 'neutro',
  descanso: 'neutro',
  antes: 'apagado',
};

function vistaSemana(ctx, fechaParam) {
  const { hoy, ajustes, registros } = ctx;
  const base = fechaParam && isValidISO(fechaParam) ? fechaParam : hoy;
  const lunes = mondayOf(base);
  const domingo = addDays(lunes, 6);
  const semana = weekProgress(lunes, ajustes, registros, hoy);
  const numero = programWeek(ajustes.inicio, lunes);
  const fase = phaseFor(numero);
  const esEstaSemana = mondayOf(hoy) === lunes;
  const mismoMes = parseISO(lunes).getMonth() === parseISO(domingo).getMonth();

  return h('div', { class: 'pila' },
    h('header', { class: 'encabezado' },
      h('p', { class: 'sobretitulo' }, numero ? `Semana ${numero} · ${fase.nombre}` : 'Antes del inicio del programa'),
      h('h1', {}, mismoMes ? `${parseISO(lunes).getDate()}–${formatShort(domingo)}` : `${formatShort(lunes)} – ${formatShort(domingo)}`)),
    h('nav', { class: 'nav-semana', 'aria-label': 'Cambiar de semana' },
      h('a', { class: 'boton boton-secundario', href: `#/semana/${addDays(lunes, -7)}` }, icono('izquierda'), 'Anterior'),
      esEstaSemana ? h('span', { class: 'etiqueta etiqueta-acento' }, 'Esta semana') : h('a', { class: 'boton boton-texto', href: `#/semana/${mondayOf(hoy)}` }, 'Hoy'),
      h('a', { class: 'boton boton-secundario', href: `#/semana/${addDays(lunes, 7)}` }, 'Siguiente', icono('derecha'))),
    numero ? h('p', { class: 'apagado' }, `${semana.hechas} de ${semana.obligatorias} actividades obligatorias registradas como hechas.`) : null,
    h('ol', { class: 'lista-dias' }, semana.dias.map((d) => {
      const est = d.estado;
      const detalle = est.hechas + est.omitidas > 0
        ? `${est.obligatoriasHechas}/${est.obligatorias} obligatorias${est.omitidas ? ` · ${est.omitidas} omitidas` : ''}`
        : d.plan.minutosObligatorios ? `≈ ${d.plan.minutosObligatorios} min` : 'Opcional';
      return h('li', {},
        h('a', { class: `fila-dia ${d.fecha === hoy ? 'es-hoy' : ''}`, href: `#/dia/${d.fecha}`, 'aria-label': `${capitalize(formatLong(d.fecha))}, ${d.plan.titulo}, ${ESTADOS_DIA[est.estado]}` },
          h('div', { class: 'fecha-dia' },
            h('span', { class: 'dia-nombre' }, DIAS_NOMBRE[weekdayIndex(d.fecha)].slice(0, 3)),
            h('span', { class: 'dia-num num' }, String(parseISO(d.fecha).getDate()))),
          h('div', { class: 'info-dia' },
            h('strong', {}, d.plan.titulo),
            h('span', { class: 'apagado' }, detalle)),
          h('div', { class: 'estado-dia' }, etiqueta(ESTADOS_DIA[est.estado], TONO_ESTADO[est.estado]))));
    })),
    h('p', { class: 'pie' }, '«Sin registro» significa que no anotaste nada ese día; no se da por hecho ni por omitido.'));
}

// ---- js/ui/day.js ----
// Vista del día: todas las actividades en una sola pantalla, agrupadas por bloques,
// con su registro (series, repeticiones, dificultad, técnica, molestias y notas).


const abiertas = new Set();
const editando = new Set();

const DIFICULTAD = [['facil', 'Fácil'], ['moderada', 'Moderada'], ['dificil', 'Difícil'], ['muy-dificil', 'Muy difícil']];
const TECNICA = [['buena', 'Buena'], ['regular', 'Regular'], ['mala', 'Mala']];
const CONTROL = [['buena', 'Buen control'], ['regular', 'Regular'], ['mala', 'Me costó']];
const MOLESTIAS = [['ninguna', 'Ninguna'], ['leve', 'Leve'], ['moderada', 'Moderada'], ['fuerte', 'Fuerte']];
const TEXTOS = Object.fromEntries([...DIFICULTAD, ...TECNICA, ...MOLESTIAS]);

function vistaDia(ctx, fechaParam) {
  const { hoy, ajustes, registros } = ctx;
  const fecha = fechaParam && isValidISO(fechaParam) ? fechaParam : hoy;
  const plan = dayPlan(fecha, ajustes);
  const registro = registros[fecha] || { fecha, actividades: {} };
  const estado = dayStatus(plan, registro, hoy);
  const esFuturo = fecha > hoy;
  const bloqueado = esFuturo || plan.antesDeInicio;

  const raiz = h('div', { class: 'pila' });
  raiz.append(h('header', { class: 'encabezado' },
    h('a', { class: 'volver', href: `#/semana/${mondayOf(fecha)}` }, icono('izquierda'), 'Semana'),
    h('p', { class: 'sobretitulo' }, plan.semana ? `Semana ${plan.semana} · ${plan.fase.nombre}` : 'Antes del inicio'),
    h('h1', {}, plan.titulo),
    h('p', { class: 'apagado' }, `${capitalize(formatLong(fecha))}${fecha === hoy ? ' · hoy' : ''}`)));

  raiz.append(h('nav', { class: 'nav-semana', 'aria-label': 'Cambiar de día' },
    h('a', { class: 'boton boton-secundario', href: `#/dia/${addDays(fecha, -1)}` }, icono('izquierda'), 'Día anterior'),
    h('a', { class: 'boton boton-secundario', href: `#/dia/${addDays(fecha, 1)}` }, 'Día siguiente', icono('derecha'))));

  raiz.append(h('section', { class: 'tarjeta resumen-dia' },
    h('div', { class: 'fila-entre' },
      etiqueta(plan.tipoNombre, plan.tipo),
      etiqueta(ESTADOS_DIA[estado.estado], estado.estado === 'completo' ? 'ok' : estado.estado === 'parcial' ? 'aviso' : 'neutro')),
    h('p', {}, plan.resumen),
    h('p', { class: 'apagado' }, `Obligatorio ≈ ${plan.minutosObligatorios} min${plan.minutosOpcionales ? ` · opcional ≈ ${plan.minutosOpcionales} min` : ''}`),
    estado.obligatorias ? h('div', { class: 'progreso' },
      h('div', { class: 'fila-entre' }, h('span', {}, 'Obligatorias hechas'), h('strong', { class: 'num' }, `${estado.obligatoriasHechas} de ${estado.obligatorias}`)),
      barraProgreso(estado.obligatoriasHechas, estado.obligatorias, 'Progreso del día')) : null,
    esFuturo ? h('p', { class: 'aviso aviso-info' }, icono('info'), h('span', {}, 'Es un día futuro: puedes leer la sesión, pero el registro se activa ese día.')) : null,
    plan.antesDeInicio ? h('p', { class: 'aviso aviso-info' }, icono('info'), h('span', {}, 'Este día es anterior al inicio de tu programa.')) : null));

  for (const seccion of groupBySection(plan.actividades)) {
    raiz.append(h('section', { class: 'seccion', 'aria-labelledby': `sec-${seccion.id}` },
      h('h2', { class: 'titulo-seccion', id: `sec-${seccion.id}` }, seccion.nombre,
        h('span', { class: 'num apagado' }, ` · ${seccion.items.reduce((t, a) => t + (a.minutos || 0), 0)} min`)),
      seccion.id === 'suelo-pelvico' ? h('p', { class: 'nota-seccion' }, 'Equilibra contracción y relajación. Si aparece dolor pélvico o empeoran los síntomas, detén la práctica y consulta a un profesional.') : null,
      h('ol', { class: 'lista-actividades' }, seccion.items.map((a) => h('li', {}, tarjetaActividad(ctx, fecha, a, registro, bloqueado))))));
  }

  return raiz;
}

function tarjetaActividad(ctx, fecha, a, registro, bloqueado) {
  const clave = `${fecha}:${a.id}`;
  const entrada = registro.actividades[a.id];
  const abierta = abiertas.has(clave);
  const ej = a.datos;
  const estadoClase = entrada ? `est-${entrada.estado}` : 'est-pendiente';

  const alternar = () => {
    if (abiertas.has(clave)) abiertas.delete(clave); else abiertas.add(clave);
    ctx.redibujar();
  };

  const tarjeta = h('article', { class: `actividad ${estadoClase} ${abierta ? 'abierta' : ''}` });
  tarjeta.append(h('button', { class: 'actividad-cabecera', type: 'button', 'aria-expanded': String(abierta), onclick: alternar },
    h('span', { class: 'estado-icono' }, entrada?.estado === 'hecho' ? icono('check') : entrada?.estado === 'omitido' ? icono('x') : null),
    h('span', { class: 'actividad-texto' },
      h('span', { class: 'actividad-nombre' }, ej?.privado ? h('span', { class: 'con-icono' }, icono('candado'), ej.nombre) : ej?.nombre || a.ejercicio),
      h('span', { class: 'actividad-detalle' }, prescriptionText(a), a.ajustado ? h('span', { class: 'ajustado' }, ` · ajustado (antes ${a.ajustado.original})`) : null)),
    h('span', { class: 'actividad-lado' },
      a.obligatoria ? etiqueta('Obligatoria', 'neutro') : etiqueta('Opcional', 'apagado'),
      icono('derecha', 'chevron'))));

  if (!abierta) return tarjeta;

  const cuerpo = h('div', { class: 'actividad-cuerpo' });
  tarjeta.append(cuerpo);

  if (ej?.privado) {
    cuerpo.append(h('p', { class: 'apagado' }, 'Actividad opcional. Aquí solo se marca si la hiciste; los detalles se guardan dentro del área privada.'));
    cuerpo.append(h('a', { class: 'boton boton-secundario', href: '#/privado' }, icono('candado'), 'Abrir área privada'));
    if (bloqueado) return tarjeta;
    const marcar = async (estado) => {
      abiertas.delete(clave);
      await ctx.guardarEntrada(fecha, a.id, estado ? { estado, guardado: new Date().toISOString() } : null);
      avisar(estado === 'hecho' ? 'Marcada como hecha' : estado === 'omitido' ? 'Marcada como omitida' : 'Marca quitada');
    };
    cuerpo.append(h('div', { class: 'acciones' }, entrada
      ? h('button', { class: 'boton boton-texto', type: 'button', onclick: () => marcar(null) }, 'Quitar la marca')
      : [
        h('button', { class: 'boton boton-principal', type: 'button', onclick: () => marcar('hecho') }, icono('check'), 'Marcar como hecha'),
        h('button', { class: 'boton boton-secundario', type: 'button', onclick: () => marcar('omitido') }, 'Omitir hoy'),
      ]));
    return tarjeta;
  }

  if (figuraDe(ej.id)) cuerpo.append(crearFigura(figuraDe(ej.id), ej.nombre));
  cuerpo.append(h('p', { class: 'clave' }, ej.clave));
  if (ej.nota) cuerpo.append(h('p', { class: 'aviso aviso-info' }, icono('info'), h('span', {}, ej.nota)));
  cuerpo.append(h('a', { class: 'enlace', href: `#/ejercicio/${ej.id}` }, 'Ver ficha completa: cómo hacerlo paso a paso', icono('derecha')));

  if (bloqueado) return tarjeta;

  if (entrada && !editando.has(clave)) {
    cuerpo.append(resumenEntrada(a, entrada));
    cuerpo.append(h('div', { class: 'acciones' },
      h('button', { class: 'boton boton-secundario', type: 'button', onclick: () => { editando.add(clave); ctx.redibujar(); } }, 'Editar registro'),
      h('button', { class: 'boton boton-texto boton-peligro-texto', type: 'button', onclick: async () => {
        const ok = await confirmar({ titulo: 'Borrar este registro', mensaje: `Se borrará lo que anotaste en «${ej.nombre}» este día. La actividad volverá a quedar pendiente.`, textoConfirmar: 'Borrar registro', peligro: true });
        if (!ok) return;
        await ctx.guardarEntrada(fecha, a.id, null);
        avisar('Registro borrado');
      } }, 'Borrar registro')));
    return tarjeta;
  }

  cuerpo.append(formulario(ctx, fecha, a, entrada, clave));
  return tarjeta;
}

function resumenEntrada(a, e) {
  const filas = [];
  filas.push(['Estado', e.estado === 'hecho' ? 'Hecha' : 'Omitida']);
  if (e.series && e.series.some((v) => v !== null)) {
    const unidad = a.segundos ? 's' : 'rep.';
    filas.push(['Series', e.series.map((v, i) => `S${i + 1}: ${v === null ? '—' : `${v} ${unidad}`}`).join(' · ')]);
  }
  if (e.minutos !== null && e.minutos !== undefined) filas.push(['Duración', `${e.minutos} min`]);
  if (e.dificultad) filas.push(['Dificultad', TEXTOS[e.dificultad]]);
  if (e.tecnica) filas.push([a.datos.categoria === 'suelo-pelvico' ? 'Control' : 'Técnica', TEXTOS[e.tecnica]]);
  if (e.molestias) filas.push(['Molestias', TEXTOS[e.molestias]]);
  if (e.notas) filas.push(['Notas', e.notas]);
  if (e.guardado) filas.push(['Guardado', formatTime(e.guardado)]);
  return h('dl', { class: 'resumen-entrada' }, filas.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]));
}

function formulario(ctx, fecha, a, entrada, clave) {
  const ej = a.datos;
  const borrador = {
    series: entrada?.series ? [...entrada.series] : Array.from({ length: a.series || 0 }, () => null),
    minutos: entrada?.minutos ?? null,
    dificultad: entrada?.dificultad ?? null,
    tecnica: entrada?.tecnica ?? null,
    molestias: entrada?.molestias ?? null,
    notas: entrada?.notas ?? '',
  };
  const idBase = clave.replace(/[^a-z0-9]/gi, '-');
  const errores = h('p', { class: 'error', role: 'alert', hidden: true });
  const form = h('form', { class: 'formulario', novalidate: true });

  if (a.registro === 'series') {
    const unidad = a.segundos ? 'segundos' : 'repeticiones';
    const max = a.segundos ? 3600 : 500;
    const grupo = h('fieldset', { class: 'series' },
      h('legend', {}, `${a.segundos ? 'Segundos' : 'Repeticiones'} por serie${a.porLado ? ' (por lado; anota el lado más débil)' : ''}`),
      h('p', { class: 'ayuda' }, `Previsto: ${a.reps || a.segundos} ${a.segundos ? 's' : 'rep.'}. Anota lo que hiciste con buena técnica. Deja vacía una serie que no hiciste.`));
    const fila = h('div', { class: 'series-fila' });
    borrador.series.forEach((valor, i) => {
      const id = `${idBase}-s${i}`;
      fila.append(h('div', { class: 'campo campo-serie' },
        h('label', { for: id }, `Serie ${i + 1}`),
        h('input', { id, type: 'number', inputmode: 'numeric', min: '0', max: String(max), step: '1', value: valor ?? '', 'aria-describedby': `${idBase}-unidad`,
          oninput: (e) => { borrador.series[i] = e.target.value === '' ? null : Number(e.target.value); } })));
    });
    grupo.append(fila, h('span', { id: `${idBase}-unidad`, class: 'sr' }, unidad));
    form.append(grupo);
  } else {
    const id = `${idBase}-min`;
    form.append(h('div', { class: 'campo' },
      h('label', { for: id }, 'Duración real (minutos)'),
      h('input', { id, type: 'number', inputmode: 'numeric', min: '0', max: '600', step: '1', placeholder: String(a.minutos || ''), value: borrador.minutos ?? '',
        oninput: (e) => { borrador.minutos = e.target.value === '' ? null : Number(e.target.value); } })));
  }

  const conEsfuerzo = ['fuerza', 'habilidad', 'core', 'cardio'].includes(ej.categoria);
  if (conEsfuerzo) {
    form.append(opciones({ nombre: `${idBase}-dif`, leyenda: 'Dificultad percibida', valores: DIFICULTAD, actual: borrador.dificultad, alCambiar: (v) => { borrador.dificultad = v; } }));
  }
  if (a.registro === 'series') {
    form.append(opciones({ nombre: `${idBase}-tec`, leyenda: ej.categoria === 'suelo-pelvico' ? 'Control y coordinación' : 'Calidad de la técnica', valores: ej.categoria === 'suelo-pelvico' ? CONTROL : TECNICA, actual: borrador.tecnica, alCambiar: (v) => { borrador.tecnica = v; } }));
  }
  form.append(opciones({ nombre: `${idBase}-mol`, leyenda: 'Dolor o molestias', valores: MOLESTIAS, actual: borrador.molestias, alCambiar: (v) => { borrador.molestias = v; } }));

  const idNotas = `${idBase}-notas`;
  form.append(h('div', { class: 'campo' },
    h('label', { for: idNotas }, 'Notas (opcional)'),
    h('textarea', { id: idNotas, rows: '2', maxlength: '1000', placeholder: 'Ej.: la última serie costó mantener la cadera', oninput: (e) => { borrador.notas = e.target.value; } }, borrador.notas)));

  const guardar = async (estado) => {
    const problema = validar(a, borrador, estado);
    if (problema) {
      errores.textContent = problema;
      errores.hidden = false;
      return;
    }
    errores.hidden = true;
    const nueva = {
      estado,
      series: a.registro === 'series' ? borrador.series : undefined,
      minutos: a.registro === 'tiempo' ? borrador.minutos : undefined,
      dificultad: borrador.dificultad,
      tecnica: borrador.tecnica,
      molestias: borrador.molestias,
      notas: borrador.notas.trim(),
      guardado: new Date().toISOString(),
    };
    try {
      editando.delete(clave);
      abiertas.delete(clave);
      await ctx.guardarEntrada(fecha, a.id, nueva);
      avisar(estado === 'hecho' ? 'Guardado como hecha' : 'Guardado como omitida');
      if (nueva.molestias === 'moderada' || nueva.molestias === 'fuerte') {
        avisar('Guardado. Registraste molestias: usa la versión fácil o sáltate este ejercicio la próxima vez.', 'aviso');
      }
    } catch (error) {
      console.error(error);
      abiertas.add(clave);
      errores.textContent = 'No se pudo guardar. Tus datos siguen en el formulario; inténtalo de nuevo.';
      errores.hidden = false;
    }
  };

  return form;
}

// Devuelve un mensaje si algo no es válido, o null si todo está bien.
function validar(a, b, estado) {
  if (a.registro === 'simple' || a.registro === 'ninguno') return null;
  const max = a.segundos ? 3600 : 500;
  if (a.registro === 'series') {
    for (const [i, v] of b.series.entries()) {
      if (v === null) continue;
      if (!Number.isInteger(v) || v < 0 || v > max) return `La serie ${i + 1} debe ser un número entero entre 0 y ${max}.`;
    }
    if (estado === 'hecho' && b.series.every((v) => v === null)) {
      return 'Anota al menos una serie antes de guardar como hecha (o usa «Omitir hoy» si no la hiciste).';
    }
  } else if (b.minutos !== null && b.minutos !== undefined && (!Number.isInteger(b.minutos) || b.minutos < 0 || b.minutos > 600)) {
    return 'Los minutos deben ser un número entero entre 0 y 600.';
  }
  return null;
}

function vistaHistorial(ctx) {
  const { registros, ajustes, hoy } = ctx;
  const fechas = Object.keys(registros).filter(isValidISO).sort().reverse()
    .filter((f) => Object.keys(registros[f].actividades || {}).length > 0);

  const raiz = h('div', { class: 'pila' },

      h('p', { class: 'apagado' }, 'Tus semanas, tu evolución y los días en los que anotaste algo. Completar actividades no es lo mismo que mejorar: para eso mira la evolución por ejercicio.')));

  const semanas = seccionSemanas(ctx);
  if (semanas) raiz.append(semanas);
  raiz.append(h('a', { class: 'tarjeta acceso-directo', href: '#/progreso' },
    h('div', { class: 'fila-entre' }, h('h2', { class: 'h3' }, 'Evolución por ejercicio'), icono('derecha')),

      h('a', { class: 'boton boton-principal', href: `#/dia/${hoy}` }, 'Ir a la sesión de hoy')));
    return raiz;
  }

  const porMes = new Map();
  for (const f of fechas) {
    const mes = formatMonth(f);
    if (!porMes.has(mes)) porMes.set(mes, []);
    porMes.get(mes).push(f);
  }

  for (const [mes, lista] of porMes) {
    const hechasMes = lista.reduce((t, f) => t + Object.values(registros[f].actividades).filter((e) => e.estado === 'hecho').length, 0);
    raiz.append(h('section', { class: 'seccion' },

      h('ul', { class: 'lista-dias' }, lista.map((f) => {
        const plan = dayPlan(f, ajustes);
        const reg = registros[f];
        const est = dayStatus(plan, reg, hoy);
        const conMolestias = plan.actividades.some((a) => ['moderada', 'fuerte'].includes(reg.actividades[a.id]?.molestias));
        return h('li', {},
          h('a', { class: 'fila-dia', href: `#/dia/${f}` },
            h('div', { class: 'info-dia' },
              h('strong', {}, capitalize(formatLong(f))),
              h('span', { class: 'apagado' }, `${plan.titulo} · ${est.hechas} hechas${est.omitidas ? ` · ${est.omitidas} omitidas` : ''}`)),

              etiqueta(ESTADOS_DIA[est.estado], est.estado === 'completo' ? 'ok' : 'aviso'),
              icono('derecha', 'chevron'))));
      }))));
  }
  return raiz;

// Semanas del programa (de la más reciente a la primera), con constancia y estado de la evaluación.
function seccionSemanas(ctx) {
  const { ajustes, registros, hoy, evaluaciones } = ctx;
  if (!ajustes.inicio) return null;
  const semanas = [];
  for (let lunes = mondayOf(hoy); lunes >= mondayOf(ajustes.inicio) && semanas.length < 12; lunes = addDays(lunes, -7)) semanas.push(lunes);
  return h('section', { class: 'seccion' },
    h('h2', { class: 'titulo-seccion' }, 'Semanas'),
    h('ul', { class: 'lista-dias' }, semanas.map((lunes) => {
      const n = programWeek(ajustes.inicio, lunes);
      const p = weekProgress(lunes, ajustes, registros, hoy);
      const enCurso = addDays(lunes, 6) > hoy && !evaluaciones[lunes];
      const estado = evaluaciones[lunes] ? etiqueta('Evaluada', 'ok') : enCurso ? etiqueta('En curso', 'neutro') : etiqueta('Evaluar', 'acento');
      return h('li', {},
        h('a', { class: 'fila-dia', href: `#/evaluacion/${lunes}` },
          h('div', { class: 'info-dia' },
            h('strong', {}, `Semana ${n} · ${phaseFor(n).nombre}`),
            h('span', { class: 'apagado num' }, `${formatShort(lunes)} – ${formatShort(addDays(lunes, 6))} · ${p.hechas}/${p.obligatorias} obligatorias`)),
          h('div', { class: 'estado-dia' }, estado, icono('derecha', 'chevron'))));
    })));
}

function mmss(segundos) {
  const s = Math.max(0, Math.floor(segundos));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function arrancarReloj() {
  clearInterval(relojPrivado);
  relojPrivado = setInterval(() => {
    const sesion = estadoPrivado.sesion;
    const total = document.getElementById('reloj-total');
    if (!sesion || !total) { clearInterval(relojPrivado); relojPrivado = null; return; }
    const ahora = Date.now();
    total.textContent = mmss((ahora - sesion.inicio) / 1000);
    if (sesion.enPausa) {
      const transcurrido = (ahora - sesion.enPausa.inicio) / 1000;
      const relojPausa = document.getElementById('reloj-pausa');
      const respiracion = document.getElementById('guia-respiracion');
      if (relojPausa) relojPausa.textContent = mmss(transcurrido);
      if (respiracion) {
        const fase = Math.floor(transcurrido) % 10;
        respiracion.textContent = fase < 4 ? 'Toma aire lento…' : 'Suelta el aire despacio…';
        respiracion.dataset.fase = fase < 4 ? 'entra' : 'sale';
      }
    }
  }, 1000);
}

  return h('div', { class: 'pila' }, cabecera,

          sesion.enPausa = { nivel: n, inicio: Date.now() };

      h('button', { class: 'boton boton-principal', type: 'button', onclick: () => {

        if (!ok) return;
        estadoPrivado.sesion = null;
        ctx.redibujar();
      } }, 'Cancelar')));
}

function nuevoCierre(sesion) {
  if (!sesion) {
    return { fecha: todayISO(), minutos: null, pausas: null, nivelesPausa: [], nivelMax: null, aTiempo: null, final: null, notas: '', cronometro: false };
  }
  const niveles = sesion.pausas.map((p) => p.nivel);
  let aTiempo = null;
  if (niveles.length) {
    const buenas = niveles.filter((n) => n <= NIVEL_MAXIMO_A_TIEMPO).length;
    aTiempo = buenas === niveles.length ? 'si' : buenas > 0 ? 'a-veces' : 'no';
  }
  return {
    fecha: todayISO(),
    minutos: Math.max(1, Math.round((Date.now() - sesion.inicio) / 60000)),
    pausas: niveles.length,
    nivelesPausa: niveles,
    segundosPausa: sesion.pausas.map((p) => p.segundos),
    nivelMax: niveles.length ? Math.max(...niveles) : null,
    aTiempo,
    final: null,
    notas: '',
    cronometro: true,
  };
}

function validarPractica(b, hoy) {
  if (!isValidISO(b.fecha)) return 'Elige una fecha válida.';
  if (b.fecha > hoy) return 'La fecha no puede ser futura.';
  if (b.minutos !== null && (!Number.isInteger(b.minutos) || b.minutos < 0 || b.minutos > 600)) return 'Los minutos deben ser un número entero entre 0 y 600.';
  if (b.pausas !== null && (!Number.isInteger(b.pausas) || b.pausas < 0 || b.pausas > 50)) return 'El número de pausas debe ser un entero entre 0 y 50.';
  if (b.nivelMax !== null && (!Number.isInteger(b.nivelMax) || b.nivelMax < 0 || b.nivelMax > 10)) return 'El nivel máximo debe estar entre 0 y 10.';
  return null;
}

// ---- js/pwa.js ----
// Instalación como app y funcionamiento sin internet (PWA).
// - Registra el service worker (sw.js), que guarda los archivos de la app en el teléfono.
// - Avisa cuando hay una versión nueva; solo se aplica cuando el usuario pulsa "Actualizar".
// - Guarda el aviso de instalación del navegador para ofrecer un botón "Instalar".
// Tus datos no dependen de esto: están en IndexedDB y se conservan al actualizar.

const estadoPwa = {
  soportado: false,
  motivo: null,
  listaSinConexion: false,
  actualizacion: null, // service worker nuevo esperando
  avisoInstalar: null, // evento beforeinstallprompt guardado
  instalada: false,
  enLinea: true,
  version: null,
};

function avisarCambio() {
  window.dispatchEvent(new CustomEvent('pwa-cambio'));
}

function leerEstadoPwa() {
  return { ...estadoPwa };
}

async function pedirVersion(sw) {
  try {
    const canal = new MessageChannel();
    const respuesta = new Promise((resolve) => { canal.port1.onmessage = (e) => resolve(e.data); setTimeout(() => resolve(null), 1500); });
    sw.postMessage('version', [canal.port2]);
    return await respuesta;
  } catch (_) {
    return null;
  }
}

function vigilarNuevo(registro, sw) {
  if (!sw) return;
  const revisar = () => {
    if (sw.state === 'installed' && navigator.serviceWorker.controller) {
      estadoPwa.actualizacion = sw;
      avisarCambio();
    }
  };
  sw.addEventListener('statechange', revisar);
  revisar();
}

async function iniciarPwa() {
  estadoPwa.enLinea = navigator.onLine !== false;
  window.addEventListener('online', () => { estadoPwa.enLinea = true; avisarCambio(); });
  window.addEventListener('offline', () => { estadoPwa.enLinea = false; avisarCambio(); });

  try {
    estadoPwa.instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  } catch (_) { /* sin soporte */ }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    estadoPwa.avisoInstalar = e;
    avisarCambio();
  });
  window.addEventListener('appinstalled', () => {
    estadoPwa.instalada = true;
    estadoPwa.avisoInstalar = null;
    avisarCambio();
  });

  if (window.__VISTA_PREVIA__) { estadoPwa.motivo = 'vista-previa'; avisarCambio(); return; }
  if (!('serviceWorker' in navigator)) { estadoPwa.motivo = 'sin-soporte'; avisarCambio(); return; }
  if (!window.isSecureContext) { estadoPwa.motivo = 'no-seguro'; avisarCambio(); return; }

  estadoPwa.soportado = true;
  try {
    const registro = await navigator.serviceWorker.register('./sw.js');
    if (registro.waiting && navigator.serviceWorker.controller) { estadoPwa.actualizacion = registro.waiting; }
    registro.addEventListener('updatefound', () => vigilarNuevo(registro, registro.installing));
    const listo = await navigator.serviceWorker.ready;
    estadoPwa.listaSinConexion = Boolean(listo.active);
    if (listo.active) estadoPwa.version = await pedirVersion(listo.active);
    // Al volver a la app, comprueba si hay versión nueva publicada.
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') registro.update().catch(() => {}); });
  } catch (error) {
    console.warn('No se pudo preparar el modo sin conexión:', error);
    estadoPwa.motivo = 'error';
  }
  avisarCambio();
}

// Aplica la versión nueva: el service worker nuevo toma el control y la página se recarga.
function aplicarActualizacion() {
  const sw = estadoPwa.actualizacion;
  if (!sw) return;
  navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload(), { once: true });
  sw.postMessage('actualizar');
}

async function instalar() {
  const aviso = estadoPwa.avisoInstalar;
  if (!aviso) return 'no-disponible';
  aviso.prompt();
  const { outcome } = await aviso.userChoice;
  estadoPwa.avisoInstalar = null;
  avisarCambio();
  return outcome; // 'accepted' o 'dismissed'
}
